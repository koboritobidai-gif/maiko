<title>フェース タスクボード</title>
<style>
/*
 * デザイントークン。
 * コーポレートサイト（faith-gr.co.jp）に合わせ、白地・スレートネイビーの
 * ナビゲーション・ゴールドの罫線という3色構成にしている。
 * 色を調整する場合はこのブロックだけを差し替える。
 */
:root {
  --bg: #f4f5f6;
  --surface: #ffffff;
  --surface-soft: #fafafa;
  --line: #e5e5e5;
  --line-strong: #d6d6d6;
  --rule-gold: #ddd0ac;      /* サイドバーの区切り線に使う淡いゴールド */

  --ink: #333333;
  --ink-heading: #3a4657;
  --ink-soft: #6b6b6b;
  --ink-faint: #9a9a9a;

  --navy: #4e5d7a;           /* グローバルナビの帯 */
  --navy-deep: #3e4c67;      /* 選択中の項目 */
  --gold: #b59a4e;           /* 見出し・アクセント */
  --gold-light: #c9a961;
  --gold-tint: #f6f1e4;
  --on-navy: #ffffff;

  --danger: #a8443a;  --danger-tint: #fbeeec;  --danger-line: #ecd3ce;
  --warn: #a97c25;    --warn-tint: #fbf3e2;    --warn-line: #ecdcb9;
  --ok: #4c7355;      --ok-tint: #eef4ef;      --ok-line: #d2e2d6;
  --info: #4e5d7a;    --info-tint: #eef1f5;    --info-line: #d3dae4;

  --radius: 4px;
  --radius-sm: 3px;
  --shadow: 0 1px 2px rgba(58, 70, 87, 0.05);

  --sans: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic",
    "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
  --serif: "Hiragino Mincho ProN", "Yu Mincho", "Times New Roman", serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ── ロゴ ───────────────────────────────────── */
/* コーポレートサイトのロゴに倣い、明朝の欧文にゴールドの斜線を重ねる。 */
.logo {
  position: relative;
  display: inline-block;
  font-family: var(--serif);
  font-size: 21px;
  letter-spacing: 0.22em;
  line-height: 1;
  padding: 4px 8px 4px 0;
}
.logo::after {
  content: "";
  position: absolute;
  top: -3px;
  left: 58%;
  width: 1px;
  height: calc(100% + 8px);
  background: var(--gold-light);
  transform: rotate(20deg);
}

/* ── グローバルバー ─────────────────────────── */
.topband {
  display: flex;
  align-items: center;
  gap: 18px;
  background: var(--navy);
  border-bottom: 4px solid var(--gold);
  color: var(--on-navy);
  padding: 10px 26px;
}
.topband .logo { color: var(--on-navy); }
.topband-title {
  font-size: 12px;
  letter-spacing: 0.14em;
  color: rgba(255, 255, 255, 0.82);
  border-left: 1px solid rgba(255, 255, 255, 0.3);
  padding-left: 18px;
}
.topband .spacer { flex: 1; }

.userpill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: rgba(255, 255, 255, 0.9);
}
.userpill form { display: flex; }
.userpill button {
  background: none;
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 2px;
  cursor: pointer;
  color: rgba(255, 255, 255, 0.9);
  font-size: 11.5px;
  padding: 2px 10px;
}
.userpill button:hover { background: rgba(255, 255, 255, 0.12); }

/* ── レイアウト ─────────────────────────────── */
.shell { display: flex; min-height: calc(100vh - 86px); }

.sidebar {
  width: 190px;
  flex: 0 0 190px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 14px 12px 32px;
}

.nav { display: flex; flex-direction: column; }
.nav-label {
  font-size: 10.5px;
  letter-spacing: 0.12em;
  color: var(--gold);
  padding: 13px 2px 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 8px 7px 3px;
  color: var(--ink);
  font-size: 12.5px;
  line-height: 1.5;
  border-bottom: 1px solid var(--rule-gold);
}
/* コーポレートサイトのサイドメニューに合わせ、項目の頭に山括弧を置く。 */
.nav-item .ico {
  width: 14px;
  text-align: center;
  color: var(--gold);
  font-size: 11px;
}
.nav-item:hover { color: var(--gold); }
.nav-item.active {
  background: var(--gold);
  color: var(--on-navy);
  border-bottom-color: var(--gold);
  padding-left: 10px;
}
.nav-item.active .ico { color: var(--on-navy); }
.nav-item .count {
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.nav-item.active .count { color: rgba(255, 255, 255, 0.8); }

.main { flex: 1; min-width: 0; padding: 20px 24px 56px; }

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.greeting { font-size: 16px; font-weight: 600; color: var(--ink-heading); }
.topbar .today { font-size: 12px; color: var(--ink-faint); }

/* 画面名。サイトの見出しに倣い、ゴールドの欧文＋和文の小見出しにする。 */
.page-title {
  margin: 0 0 18px;
  font-family: var(--serif);
  font-size: 21px;
  letter-spacing: 0.08em;
  color: var(--gold);
  font-weight: 400;
}

/* ── セクション ─────────────────────────────── */
.section { margin-bottom: 24px; }
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-heading);
  border-left: 3px solid var(--gold);
  padding-left: 9px;
}
.section-note { font-size: 11.5px; color: var(--ink-faint); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.card-pad { padding: 16px 18px; }

/* ── 指標カード ─────────────────────────────── */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 12px;
}
.metric {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 2px solid var(--navy);
  border-radius: var(--radius);
  padding: 13px 16px;
  box-shadow: var(--shadow);
}
.metric .label { font-size: 11.5px; color: var(--ink-soft); }
.metric .value {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--ink-heading);
  font-variant-numeric: tabular-nums;
}
.metric .value .unit { font-size: 13px; font-weight: 400; margin-left: 2px; }
.metric .note { font-size: 11px; color: var(--ink-faint); }
.metric.alert { border-top-color: var(--danger); }
.metric.alert .value, .metric.alert .note { color: var(--danger); }
.metric.warn { border-top-color: var(--gold); }
.metric.warn .value { color: var(--gold); }

/* ── チップ・バッジ ─────────────────────────── */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line-strong);
  background: var(--surface);
  border-radius: 2px;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--ink-soft);
  cursor: pointer;
}
.chip:hover { border-color: var(--gold); color: var(--ink); }
.chip.active { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }

.badge {
  display: inline-block;
  border-radius: 2px;
  padding: 1px 8px;
  font-size: 11px;
  line-height: 1.7;
  white-space: nowrap;
  border: 1px solid transparent;
}
.badge-not_started { background: var(--surface-soft); color: var(--ink-soft); border-color: var(--line-strong); }
.badge-in_progress { background: var(--info-tint); color: var(--info); border-color: var(--info-line); }
.badge-blocked { background: var(--warn-tint); color: var(--warn); border-color: var(--warn-line); }
.badge-done { background: var(--ok-tint); color: var(--ok); border-color: var(--ok-line); }
.badge-cancelled { background: var(--surface-soft); color: var(--ink-faint); border-color: var(--line); }
.badge-exec { background: var(--gold-tint); color: var(--gold); border-color: var(--rule-gold); }
.badge-overdue { background: var(--danger-tint); color: var(--danger); border-color: var(--danger-line); }
.badge-soon { background: var(--warn-tint); color: var(--warn); border-color: var(--warn-line); }

/* ── テーブル ───────────────────────────────── */
.table-wrap { overflow-x: auto; }
/* 列が潰れて1文字ずつ折り返すのを防ぐ。これより狭ければ表だけ横スクロールする。 */
table.data { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--ink-soft);
  padding: 9px 12px;
  background: var(--surface-soft);
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.data td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
table.data tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: var(--surface-soft); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.task-link { font-weight: 600; color: var(--ink-heading); }
.task-link:hover { color: var(--gold); text-decoration: underline; }
.code {
  font-size: 11.5px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ── 進捗バー ───────────────────────────────── */
.bar-row { display: flex; align-items: center; gap: 12px; padding: 7px 0; }
.bar-name { width: 132px; flex: 0 0 132px; font-size: 12.5px; }
.bar-track {
  flex: 1;
  height: 8px;
  background: #eceded;
  border-radius: 1px;
  overflow: hidden;
  display: flex;
}
.bar-fill { height: 100%; }
.bar-fill.done { background: var(--ok); }
.bar-fill.in_progress { background: var(--navy); }
.bar-fill.blocked { background: var(--gold); }
.bar-fill.not_started { background: var(--line-strong); }
.bar-value { width: 108px; text-align: right; font-size: 12px; color: var(--ink-soft); }

/* ── フォーム ───────────────────────────────── */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--ink-soft); }
.field .hint { font-size: 11px; color: var(--ink-faint); }
input[type="text"], input[type="email"], input[type="password"], input[type="date"],
input[type="search"], input[type="file"], select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  background: var(--surface);
  width: 100%;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(181, 154, 78, 0.14);
}
textarea { resize: vertical; min-height: 76px; }
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 0 14px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface);
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--gold); color: var(--gold); }
.btn-primary {
  background: var(--navy);
  border-color: var(--navy);
  color: var(--on-navy);
}
.btn-primary:hover { background: var(--navy-deep); border-color: var(--navy-deep); color: var(--on-navy); }
.btn-sm { padding: 5px 11px; font-size: 12px; }
.btn-danger { color: var(--danger); border-color: var(--danger-line); background: var(--danger-tint); }

/* 議事録ファイルの受け口。 */
.dropzone {
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface-soft);
  padding: 20px 16px;
  text-align: center;
  margin-bottom: 14px;
  transition: border-color .15s, background .15s;
}
.dropzone.is-over { border-color: var(--gold); background: var(--gold-tint); }
.dropzone-main { font-size: 13px; color: var(--ink-heading); font-weight: 600; }
.dropzone-sub { font-size: 11.5px; color: var(--ink-faint); margin-top: 3px; }
.dropzone-file { font-size: 11.5px; color: var(--ok); margin-top: 8px; }
.dropzone .btn { display: inline-flex; }

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: flex-end;
  margin-bottom: 12px;
}
.toolbar .field { margin-bottom: 0; min-width: 150px; }
.toolbar .grow { flex: 1; min-width: 200px; }

.notice {
  border-radius: var(--radius-sm);
  padding: 10px 13px;
  font-size: 12.5px;
  margin-bottom: 14px;
  border: 1px solid;
  border-left-width: 3px;
}
.notice-error { background: var(--danger-tint); border-color: var(--danger-line); border-left-color: var(--danger); color: var(--danger); }
.notice-info { background: var(--info-tint); border-color: var(--info-line); border-left-color: var(--navy); color: var(--info); }
.notice-ok { background: var(--ok-tint); border-color: var(--ok-line); border-left-color: var(--ok); color: var(--ok); }

.empty { padding: 26px; text-align: center; color: var(--ink-faint); font-size: 13px; }

/* ── 詳細ページ ─────────────────────────────── */
.detail-grid { display: grid; grid-template-columns: 1.55fr 1fr; gap: 16px; align-items: start; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--ink-faint); font-size: 12px; }
.kv dd { margin: 0; }

.timeline { display: flex; flex-direction: column; }
.timeline-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
.timeline-item:last-child { border-bottom: none; }
.timeline-meta { font-size: 11.5px; color: var(--ink-faint); margin-bottom: 3px; }
.timeline-body { font-size: 13px; white-space: pre-wrap; }

.backlink { font-size: 12px; color: var(--ink-soft); }
.backlink:hover { color: var(--gold); }

/* 画面が狭くなっても左右の並びは保ち、目次の幅だけを詰める。 */
@media (max-width: 1100px) {
  /* 画面が狭いときは、決定したMTG・最終更新など補助的な列を隠す。 */
  .col-sub { display: none; }
  .sidebar { width: 164px; flex: 0 0 164px; }
  .main { padding: 18px 18px 48px; }
  .detail-grid { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  .sidebar { width: 142px; flex: 0 0 142px; padding: 12px 8px 28px; }
  .nav-item { font-size: 12px; padding: 6px 4px 6px 2px; }
  .main { padding: 16px 14px 44px; }
  .topband { padding: 8px 14px; gap: 12px; }
  .topband-title { padding-left: 12px; }
}
/* 携帯サイズでも左右の並びは変えず、目次と余白をさらに詰める。
   目次を上に畳むと最初の画面が目次だけで埋まってしまうため。 */
@media (max-width: 560px) {
  .sidebar { width: 120px; flex: 0 0 120px; padding: 10px 6px 24px; }
  .nav-item { font-size: 10.5px; line-height: 1.45; padding: 6px 2px 6px 0; gap: 4px; }
  .nav-item .ico { width: 10px; font-size: 9px; }
  .nav-item .count { font-size: 10px; }
  .nav-label { font-size: 9.5px; padding: 10px 2px 3px; }
  .main { padding: 12px 10px 36px; }

  .topband { padding: 7px 10px; gap: 8px; flex-wrap: nowrap; }
  .topband .logo { font-size: 15px; letter-spacing: .16em; }
  .userpill { font-size: 10.5px; gap: 6px; }
  .userpill button { padding: 2px 7px; font-size: 10.5px; }

  .greeting { font-size: 14px; }
  .page-title { font-size: 17px; }
  .topbar { margin-bottom: 14px; padding-bottom: 10px; }
  .section-title { font-size: 13px; }

  .metrics { grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 8px; }
  .metric { padding: 9px 10px; }
  .metric .value { font-size: 20px; }

  /* 幅が足りないので、ID と担当も隠す。担当はタスクを開けば確認できる。 */
  .col-id, .col-owner { display: none; }
  table.data { min-width: 420px; }
  table.data th, table.data td { padding: 8px 8px; }
  .card-pad { padding: 12px 12px; }
}

/* 狭い画面では省く補足の文言。 */
@media (max-width: 560px) {
  .only-wide { display: none; }
}
:root:not([data-theme="light"]) { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root:not([data-theme="light"]) {
    --bg: #1a1d22;
    --surface: #22262d;
    --surface-soft: #272c34;
    --line: #363c45;
    --line-strong: #48505b;
    --rule-gold: #4a4232;
    --ink: #e6e8ea;
    --ink-heading: #dfe4ea;
    --ink-soft: #a8aeb6;
    --ink-faint: #838a93;
    --navy: #5b6c8c;
    --navy-deep: #47566f;
    --gold: #c2a75f;
    --gold-light: #d0b877;
    --gold-tint: #322c1e;
    --on-navy: #ffffff;
    --danger: #e08a7e;  --danger-tint: #3a2521;  --danger-line: #58362f;
    --warn: #d8ab53;    --warn-tint: #362c18;    --warn-line: #55421e;
    --ok: #8bbd97;      --ok-tint: #1f2c22;      --ok-line: #33492f;
    --info: #9ab2d0;    --info-tint: #232a34;    --info-line: #38455a;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
  }
  .bar-track { background: #333941; }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1d22;
  --surface: #22262d;
  --surface-soft: #272c34;
  --line: #363c45;
  --line-strong: #48505b;
  --rule-gold: #4a4232;
  --ink: #e6e8ea;
  --ink-heading: #dfe4ea;
  --ink-soft: #a8aeb6;
  --ink-faint: #838a93;
  --navy: #5b6c8c;
  --navy-deep: #47566f;
  --gold: #c2a75f;
  --gold-light: #d0b877;
  --gold-tint: #322c1e;
  --on-navy: #ffffff;
  --danger: #e08a7e;  --danger-tint: #3a2521;  --danger-line: #58362f;
  --warn: #d8ab53;    --warn-tint: #362c18;    --warn-line: #55421e;
  --ok: #8bbd97;      --ok-tint: #1f2c22;      --ok-line: #33492f;
  --info: #9ab2d0;    --info-tint: #232a34;    --info-line: #38455a;
  --shadow: 0 1px 2px rgba(0,0,0,.35);
}
:root[data-theme="dark"] .bar-track { background: #333941; }

/* ── デモ専用の部品 ─────────────────────────── */
.banner {
  background: var(--navy-deep);
  color: var(--on-navy);
  font-size: 12px;
  padding: 7px 22px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  align-items: center;
  line-height: 1.7;
}
.banner b { letter-spacing: .08em; }
@media (max-width: 560px) { .banner { font-size: 10.5px; padding: 6px 10px; line-height: 1.6; } }
.banner span { opacity: .8; }

.userpick { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,.9); }
.userpick select {
  border: 1px solid rgba(255,255,255,.4);
  background: transparent;
  color: var(--on-navy);
  border-radius: 2px;
  padding: 2px 6px;
  width: auto;
  cursor: pointer;
}
.userpick select option { color: var(--ink); background: var(--surface); }

.nav-item { background: none; border: 0; border-bottom: 1px solid var(--rule-gold); width: 100%; text-align: left; cursor: pointer; }
.nav-item[aria-current="page"] {
  background: var(--gold);
  color: var(--on-navy);
  border-bottom-color: var(--gold);
  padding-left: 10px;
}
.nav-item[aria-current="page"] .ico { color: var(--on-navy); }
.nav-item[aria-current="page"] .count { color: rgba(255,255,255,.8); }

.metric.is-alert { border-top-color: var(--danger); }
.metric.is-alert .value, .metric.is-alert .note { color: var(--danger); }

/* ── 議事録からタスクを抽出する ─────────────────────────

const TODO_HEADING = /(to\s?do|アクション\s?アイテム|action\s*items?|next\s*steps?|やること|宿題|持ち帰り|タスク)/i;
const BULLET = /^\s*(?:[-*+・･◦▪▸‣>＞]|\d+[.)．、]|[（(]\d+[）)])\s*/;
const CHECKBOX = /^\s*(?:[-*+]\s*)?\[( |x|X|✓)\]\s*/;

const OWNER_PATTERNS = [
  /[（(]\s*担当者?\s*[:：]?\s*([^）)、,]{1,14}?)\s*[）)]/,
  /担当者?\s*[:：]\s*([^\s、,。／\/（）()【】]{1,14})/,
  /担当者?\s*[はが]?\s*([^\s、,。／\/（）()【】]{1,10})\s*さん/,
  /(?:^|[\s（(【])@([^\s、,。）)】]{1,12})/,
];
const DUE_PATTERNS = [
  /[（(]\s*(?:期限|〆切|締切|締め切り|納期)\s*[:：]?\s*([^）)]{1,16}?)\s*[）)]/,
  /(?:期限|〆切|締切|締め切り|納期|提出日)\s*[:：]?\s*(\d{4}[-/年]\d{1,2}[-/月]\d{1,2}日?|\d{1,2}[-/月]\d{1,2}日?|\d{1,2}日)/,
  /(?:期限|〆切|締切|締め切り|納期|提出日)\s*[:：]?\s*([^\s、,。／\/（）()【】]{1,16})/,
  /([0-9]{1,2}[\/月][0-9]{1,2}日?)\s*(?:まで|迄)/,
  /(今日|本日|明日|明後日|今週中|今週末|来週[月火水木金土日]曜?日?|来週中|来週|再来週|週明け|月末|今月末|来月末)\s*(?:まで|迄)?/,
];

function headingOf(line) {
  if (BULLET.test(line) || CHECKBOX.test(line)) return null;
  if (/^\s*#{1,6}\s+/.test(line)) return line.replace(/^\s*#{1,6}\s+/, "").trim();
  if (/^\s*[■●◆▼○◎]/.test(line)) return line.replace(/^\s*[■●◆▼○◎]\s*/, "").trim();
  const bracket = line.match(/^\s*[【\[]([^】\]]{1,20})[】\]]\s*$/);
  if (bracket) return bracket[1].trim();
  const colon = line.match(/^\s*(.{1,20}?)\s*[:：]\s*$/);
  if (colon) return colon[1].trim();
  return null;
}

function firstMatch(line, patterns) {
  for (const re of patterns) {
    const m = line.match(re);
    if (m && m[1] && m[1].trim()) return { value: m[1].trim(), matched: m[0] };
  }
  return null;
}

/** 「9/10」「来週金曜」「月末」などを基準日から日付に直す。 */
function resolveDue(value, baseYmd) {
  const base = new Date(baseYmd + "T12:00:00Z");
  const out = (d) => d.toISOString().slice(0, 10);
  const add = (n) => { const d = new Date(base); d.setUTCDate(d.getUTCDate() + n); return out(d); };
  const build = (y, m, d) => {
    const date = new Date(Date.UTC(y, m - 1, d, 12));
    return date.getUTCMonth() === m - 1 && date.getUTCDate() === d ? out(date) : null;
  };
  const eom = (offset) => {
    const d = new Date(base);
    d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + offset + 1); d.setUTCDate(0);
    return out(d);
  };
  const nextWeekday = (target, weeksAhead) => {
    const delta = ((target - base.getUTCDay() + 7) % 7) || 7;
    return add(delta + (weeksAhead > 1 ? (weeksAhead - 1) * 7 : 0));
  };
  const text = (value || "").trim();

  let m = text.match(/^(\d{4})[-/年](\d{1,2})[-/月](\d{1,2})日?$/);
  if (m) return build(+m[1], +m[2], +m[3]);
  m = text.match(/^(\d{1,2})[-/月](\d{1,2})日?$/);
  if (m) {
    const y = base.getUTCFullYear();
    const c = build(y, +m[1], +m[2]);
    return c && c < baseYmd ? build(y + 1, +m[1], +m[2]) : c;
  }
  m = text.match(/^(\d{1,2})月(末|中)$/);
  if (m) {
    const y = base.getUTCFullYear();
    const c = out(new Date(Date.UTC(y, +m[1], 0, 12)));
    return c < baseYmd ? out(new Date(Date.UTC(y + 1, +m[1], 0, 12))) : c;
  }
  if (/^(今日|本日)$/.test(text)) return baseYmd;
  if (text === "明日") return add(1);
  if (text === "明後日") return add(2);
  if (text === "週明け") return nextWeekday(1, 1);
  if (/^(今週中|今週末)$/.test(text)) return nextWeekday(5, 1);
  if (/^(月末|今月末)$/.test(text)) return eom(0);
  if (text === "来月末") return eom(1);
  if (/^(来週中|来週)$/.test(text)) return nextWeekday(5, 2);
  if (text === "再来週") return add(14);
  m = text.match(/^来週([日月火水木金土])曜?日?$/);
  if (m) return nextWeekday("日月火水木金土".indexOf(m[1]), 2);
  return null;
}

const ITEM_START = new RegExp(`^\\s*(?:[${CIRCLED}]|[（(]?\\d{1,2}[）).．、]\\s)\\s*(.+?)\\s*$`);
const WHO_LINE = /^\s*[-*+・･\s]*(?:WHO|Who|who|ＷＨＯ|担当者?)\s*[:：]\s*(.+)$/;
const WHAT_LINE = /^\s*[-*+・･\s]*(?:WHAT|What|what|ＷＨＡＴ|内容|実施事項)\s*[:：]\s*(.+)$/;

/** 「文字さん＋友井さん」→ ["文字", "友井"] */
function splitNames(value) {
  return value.split(/[＋+、,／\/･・]+/)
    .map((n) => n.trim().replace(/さん$|様$|氏$/, "").trim())

}

/** 番号付き項目（WHO が書かれているもの）をひとかたまりとして取り出す。 */
function findActionBlocks(lines) {
  const blocks = [];
  let current = null;
  const close = (end) => { if (current && current.who) blocks.push({ ...current, end }); current = null; };

  lines.forEach((line, index) => {
    const item = line.match(ITEM_START);
    if (item && !WHO_LINE.test(line) && !WHAT_LINE.test(line)) {
      close(index);
      current = { title: item[1].trim(), who: null, detail: [], raw: [line], start: index, end: index };
      return;
    }
    if (!current || !line.trim()) return;
    const heading = headingOf(line);
    if (heading !== null && !WHO_LINE.test(line) && !WHAT_LINE.test(line)) { close(index); return; }

    current.raw.push(line);
    const who = line.match(WHO_LINE);
    if (who) { current.who = who[1].trim(); return; }
    const what = line.match(WHAT_LINE);
    current.detail.push((what ? what[1] : line).replace(/^\s*[-*+・･]\s*/, "").trim());
  });
  close(lines.length);
  return blocks;
}

/** 実施内容から期限を読む。「10月以降」のような開始時期は期限にしない。 */
function findDueInDetail(text) {
  return firstMatch(text, [
    /(?:期限|〆切|締切|納期)\s*[:：]?\s*(\d{4}[-/年]\d{1,2}[-/月]\d{1,2}日?|\d{1,2}[-/月]\d{1,2}日?)/,
    /(\d{1,2}月\d{1,2}日)(?:まで|までに|に)/,
    /(\d{1,2}月末)(?!以降)(?:まで|までに|で|に)?/,
    /(\d{1,2}月中)(?:に|まで|までに)?/,
  ]);
}

function findMember(hint) {
  if (!hint) return null;
  const key = hint.replace(/\s/g, "");
  return MEMBERS.find((m) => m.name.replace(/\s/g, "") === key)
    || MEMBERS.find((m) => m.name.split(/\s/).some((part) => part === key))
    || MEMBERS.find((m) => m.id === key.toLowerCase())
    || MEMBERS.find((m) => m.name.replace(/\s/g, "").startsWith(key) && key.length >= 2)
    || null;
}

function extractFromMinutes(text, baseYmd) {
  const lines = (text || "").replace(/\r\n?/g, "\n").split("\n");
  const rows = [];
  const seen = new Set();

  // 1) ネクストアクション形式（① + WHO/WHAT）をまとめて拾う。
  const consumed = new Set();
  for (const block of findActionBlocks(lines)) {
    for (let i = block.start; i < block.end; i += 1) consumed.add(i);
    const names = splitNames(block.who || "");
    const detail = block.detail.join("\n").trim();
    const due = findDueInDetail(block.title + "\n" + detail);
    const key = block.title.replace(/\s+/g, "");
    if (!block.title || seen.has(key)) continue;
    seen.add(key);
    const match = findMember(names[0]);
    rows.push({
      include: true,
      title: block.title,
      ownerId: match ? match.id : "",
      ownerHint: names[0] || null,
      due: due ? resolveDue(due.value, baseYmd) : null,
      dueHint: due ? due.value : null,
      raw: block.raw[0].trim(),
    });
  }

  // 2) 残りの行から、箇条書きのタスクを拾う。
  let inTodo = false;
  let inSkip = false;

  for (const [index, line] of lines.entries()) {
    if (consumed.has(index) || !line.trim()) continue;
    const heading = headingOf(line);
    if (heading !== null) {
      inTodo = TODO_HEADING.test(heading);
      inSkip = !inTodo && NON_TASK_HEADING.test(heading);
      continue;
    }
    if (inSkip) continue;

    const checkbox = CHECKBOX.test(line);
    if (checkbox && /\[(x|X|✓)\]/.test(line)) continue;

    const owner = firstMatch(line, OWNER_PATTERNS);
    const due = firstMatch(line, DUE_PATTERNS);
    const bullet = BULLET.test(line) || checkbox;
    if (!((inTodo && bullet) || checkbox || owner || (bullet && due))) continue;

    let title = line;
    for (const f of [owner && owner.matched, due && due.matched]) if (f) title = title.replace(f, " ");
    title = title.replace(CHECKBOX, "").replace(BULLET, "")
      .replace(/[（(][\s、,・:：\-–—]*[）)]/g, "")
      .replace(/\s{2,}/g, " ")
      .replace(/^[\s、,。・:：\-–—]+|[\s、,。・:：\-–—]+$/g, "").trim();
    if (title.length < 3) continue;

    const key = title.replace(/\s/g, "");
    if (seen.has(key)) continue;
    seen.add(key);

    const hint = owner ? owner.value.replace(/さん$|様$|氏$/, "") : null;
    const match = findMember(hint);

    rows.push({
      include: true,
      title,
      ownerId: match ? match.id : "",
      ownerHint: hint,
      due: due ? resolveDue(due.value, baseYmd) : null,
      dueHint: due ? due.value : null,
      raw: line.trim(),
    });
  }
  return rows;
}

/* 期限が近づいたタスクを、担当者ごとに1通へまとめたリマインドメール */
function planReminders() {
  const kinds = { overdue: "期限超過", due_today: "本日が期限", due_soon: "期限が近い", stale: "状況が未報告" };
  const order = ["overdue", "due_today", "due_soon", "stale"];
  const classify = (t) => {
    if (!isOpen(t)) return null;
    if (t.due !== null) {
      if (t.due < 0) return "overdue";
      if (t.due === 0) return "due_today";
      if (t.due <= SOON_DAYS) return "due_soon";
    }
    return t.reported >= STALE_DAYS ? "stale" : null;
  };
  const groups = new Map();
  for (const t of TASKS) {
    const kind = classify(t);
    if (!kind || !t.owner) continue;
    const owner = memberOf(t.owner);
    /* 役員限定タスクは、担当者が役員・管理者のときだけ本文へ載せる */
    if (t.vis === "executive" && !canSeeExec(owner)) continue;
    if (!groups.has(owner.id)) groups.set(owner.id, { owner, items: [] });
    groups.get(owner.id).items.push({ t, kind });
  }
  for (const g of groups.values()) g.items.sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  return { groups: [...groups.values()], kinds, order };
}

function viewMail() {
  const { groups: allGroups, kinds, order } = planReminders();
  /* 管理者は全社分、それ以外は自分宛の通知だけを見る。
     通知の一覧から役員限定タスクの内容が漏れないようにするため。 */
  const isAdmin = user().role === "admin";
  const groups = isAdmin ? allGroups : allGroups.filter((g) => g.owner.id === state.userId);
  const body = groups.map(({ owner, items }) => {
    const counts = order.map((k) => {
      const n = items.filter((i) => i.kind === k).length;
      return n ? `${kinds[k]}${n}件` : "";
    }).filter(Boolean).join("・");

    const text = [`${owner.name} さん`, "", "お疲れさまです。MTGで決まったタスクのうち、対応・状況共有をお願いしたいものです。", ""];
    for (const k of order) {
      const items_k = items.filter((i) => i.kind === k);
      if (!items_k.length) continue;
      text.push(`■ ${kinds[k]}（${items_k.length}件）`);
      for (const { t } of items_k) {
        text.push(`  #${t.code} ${t.title}`);
        text.push(`    期限: ${fmtLong(dueDate(t))}（${duePhrase(t)}） / 状況: ${STATUS[t.status]} / 最終更新: ${fmtLong(reportedDate(t))}（${t.reported}日前）`);
        text.push(`    決定したMTG: ${t.meeting}（${fmtLong(shift(t.mtg))}）`);
      }
      text.push("");
    }
    text.push("※このメールはタスク管理アプリから自動送信しています。");

    return `<div class="mail">
      <div class="mail-head">To: ${owner.login}@faith-gr.co.jp<br>
      Subject: <b>【タスク確認】${esc(owner.name)} さん / ${esc(counts)}</b></div>
      <div class="mail-body">${esc(text.join("\n"))}</div></div>`;
  }).join("");

  return `<div class="notice" style="margin-bottom:16px">
      毎朝9時に自動送信されます。1人につき1通へまとめるので、タスクが増えてもメールの通数は増えません。
      同じ内容を毎日送らないよう、種別ごとに再送間隔（期限超過は1日、期限が近いは2日、状況未報告は7日）を空けています。
    </div>` +
    section(isAdmin ? "本日送信されるリマインドメール（全社）" : "本日あなたに届くリマインドメール", `${groups.length}通`, `<div class="card-pad">${
      groups.length ? body
        : `<div class="empty">${isAdmin ? "いま通知が必要なタスクはありません。" : "あなた宛の通知はいまありません。"}</div>`}</div>`);
}

/* ── 詳細ドロワー ─────────────────────────────────────── */
function renderDrawer() {
  const overlay = document.getElementById("overlay");
  const t = TASKS.find((x) => x.code === state.openTask);
  if (!t || (t.vis === "executive" && !canSeeExec(user()))) {
    overlay.hidden = true;
    overlay.innerHTML = "";
    return;
  }
  overlay.hidden = false;
  overlay.innerHTML = `<div class="drawer" role="dialog" aria-modal="true" aria-label="${esc(t.title)}">
    <button class="drawer-close" id="closeDrawer" aria-label="閉じる">×</button>
    <div class="code">${t.code}</div>
    <h2>${esc(t.title)}${execBadge(t)}</h2>
    <dl class="kv">
      <dt>担当者</dt><dd>${t.owner ? esc(memberOf(t.owner).name) : "未定"}</dd>
      <dt>期限</dt><dd>${fmtLong(dueDate(t))} <span style="color:var(--ink-faint);font-size:12px">${duePhrase(t)}</span></dd>
      <dt>状況</dt><dd>${statusBadge(t)}</dd>
      <dt>公開範囲</dt><dd>${t.vis === "executive" ? "役員のみ" : "全社員"}</dd>
      <dt>決定したMTG</dt><dd>${esc(t.meeting)}（${fmtShort(shift(t.mtg))}）</dd>
      <dt>最終更新</dt><dd>${fmtLong(reportedDate(t))}（${t.reported}日前）</dd>
    </dl>
    ${t.desc ? `<h3>詳細・決定事項</h3><div>${esc(t.desc)}</div>` : ""}
    <h3>進捗を報告する</h3>
    <div class="field"><textarea id="upBody" placeholder="例：先方の確認待ち。9/5に回答予定。"></textarea></div>
    <div class="toolbar" style="margin-top:8px">
      <div class="field"><label for="upStatus">状況</label><select id="upStatus">
        ${Object.entries(STATUS).map(([k, v]) => `<option value="${k}"${t.status === k ? " selected" : ""}>${v}</option>`).join("")}
      </select></div>
      <button class="btn btn-primary" id="postUpdate">報告する</button>
    </div>
    <h3>進捗の履歴（${t.log.length}件）</h3>
    ${t.log.length ? t.log.slice().sort((a, b) => a.d - b.d).map((l) => `<div class="timeline-item">
        <div class="timeline-meta">${fmtLong(shift(-l.d))}　${esc(memberOf(l.by).name)}</div>
        <div class="timeline-body">${esc(l.body)}</div></div>`).join("")
      : '<div class="empty">まだ進捗報告がありません。</div>'}
  </div>`;
}

/* ── 描画とイベント ───────────────────────────────────── */

/* 議事録を読み込んでタスクを取り込む画面。
   内容を確認してから社内共有する運用のため、自動では取り込まない。 */
function viewImport() {
  const baseYmd = ymd(TODAY);
  const rows = state.importRows;
  const canExec = canSeeExec(user());
  const isAdmin = user().role === "admin";
  const memberOptions = (selected) =>
    MEMBERS.map((m) => `<option value="${m.id}"${selected === m.id ? " selected" : ""}>${esc(m.name)}</option>`).join("");

  const preview = rows === null ? "" : rows.length === 0
    ? `<div class="empty">タスクらしい行が見つかりませんでした。「ネクストアクション」「WHO：」「担当:」などの表記があると拾いやすくなります。</div>`
    : `<div class="section-head" style="margin-top:20px"><div>
         <span class="section-title">抽出結果</span>
         <span class="section-note">　${rows.length}件見つかりました。担当と期限はここで直せます。</span></div></div>
       <div class="table-wrap"><table class="data">
         <thead><tr><th style="width:44px">登録</th><th>タスク名</th>
           <th style="width:140px">担当</th><th style="width:150px">期限</th><th style="width:84px">確度</th></tr></thead>
         <tbody>${rows.map((r, i) => `<tr>
           <td><input type="checkbox" data-row="${i}" data-field="include"${r.include ? " checked" : ""}></td>
           <td><input type="text" data-row="${i}" data-field="title" value="${esc(r.title)}" style="width:100%">
               <div class="code" style="margin-top:2px">${esc(r.raw)}</div></td>
           <td><select data-row="${i}" data-field="ownerId"><option value="">未定</option>${memberOptions(r.ownerId)}</select>
               ${r.ownerHint && !r.ownerId ? `<div class="code">議事録の表記: ${esc(r.ownerHint)}</div>` : ""}</td>
           <td><input type="date" data-row="${i}" data-field="due" value="${r.due || ""}">
               ${r.dueHint && !r.due ? `<div class="code">「${esc(r.dueHint)}」を解釈できず</div>` : ""}</td>
           <td><span class="badge ${r.ownerId || r.due ? "st-done" : "st-not_started"}">${r.ownerId || r.due ? "高" : "要確認"}</span></td>
         </tr>`).join("")}</tbody></table></div>
       <div style="margin-top:14px"><button class="btn btn-primary" id="commitImport">
         ${rows.filter((r) => r.include).length}件をタスクに登録する</button></div>`;

  const sources = [
    { label: "メール", note: "nagano-t@faith-gr.co.jp から届いた、件名に【議事録送付】が付いたメールだけを取り込み" },
    { label: "Slack", note: "指定チャンネルの議事録投稿。役員チャンネルは役員限定として取り込み" },
    { label: "Google ドライブ", note: "指定フォルダの Google ドキュメント" },
  ];

  return `
  <div class="notice" style="margin-bottom:16px">
    <strong>取り込みの流れ</strong><br>
    議事録の内容を確認 → <strong>nagano-t@faith-gr.co.jp</strong> から件名に <strong>【議事録送付】</strong> を付けて社内へメール送信 → アプリが毎朝そのメールだけを取り込みます。
    件名に会議名を入れておくと、会議名と公開範囲も自動で決まります。<br>
    その場で取り込みたいときは、下からファイルをドラッグ＆ドロップするか、本文を貼り付けてください。
  </div>
  ${section("議事録を読み込む", "いま手元にある議事録を取り込みます", `<div class="card-pad">
    <div class="toolbar">
      <div class="field grow"><label for="impMeeting">会議名</label>
        <select id="impMeeting">
          <option value="">選択してください</option>
          ${MEETING_TYPES.map((m) => `<option value="${esc(m.name)}"${m.name === state.importMeeting ? " selected" : ""}>${esc(m.name)}${m.visibility === "executive" ? "（役員限定）" : ""}</option>`).join("")}
        </select></div>
      <div class="field"><label for="impDate">開催日</label><input id="impDate" type="date" value="${baseYmd}"></div>
      ${canExec ? `<div class="field"><label for="impVis">公開範囲</label>
        <select id="impVis">
          <option value="all"${state.importVisibility === "all" ? " selected" : ""}>全社員</option>
          <option value="executive"${state.importVisibility === "executive" ? " selected" : ""}>役員のみ</option>
        </select></div>` : ""}
    </div>

    <div class="dropzone${state.dragging ? " is-over" : ""}" id="dropzone">
      <div class="dropzone-main">議事録ファイルをここにドラッグ＆ドロップ</div>
      <div class="dropzone-sub">テキスト／Markdown（.txt / .md）に対応。PLAUD などで作った要約を書き出したファイルをそのまま置けます。</div>
      <label class="btn btn-sm" style="margin-top:8px">ファイルを選ぶ
        <input type="file" id="impFile" accept=".txt,.md,.markdown,text/plain,text/markdown" style="display:none"></label>
      ${state.importFileName ? `<div class="dropzone-file">読み込み済み：${esc(state.importFileName)}</div>` : ""}
    </div>

    <div class="field" style="margin-bottom:12px"><label for="impBody">議事録の本文（メールの文章を貼り付けても構いません）</label>
      <textarea id="impBody" style="min-height:190px">${esc(state.importBody)}</textarea></div>
    <button class="btn btn-primary" id="runExtract">タスクを抽出する</button>
    ${preview}
  </div>`)}
  ${isAdmin ? section("メール等からの取り込み", "件名に【議事録送付】が付いたメールだけを対象にします", `<div class="table-wrap">
    <table class="data"><thead><tr><th style="width:200px">取得元</th><th style="width:100px">状態</th><th>取り込む対象</th></tr></thead>
    <tbody>${sources.map((s) => `<tr><td style="font-weight:600">${s.label}</td>
      <td><span class="badge st-not_started">未設定</span></td>
      <td style="color:var(--ink-soft)">${s.note}</td></tr>`).join("")}</tbody></table></div>`) : ""}`;
}

const VIEWS = {
  dashboard: { label: "ダッシュボード", icon: "›", render: viewDashboard },
  tasks: { label: "タスク一覧", icon: "›", render: viewTasks },
  members: { label: "担当者別の進捗", icon: "›", render: viewMembers },
  meetings: { label: "MTG別", icon: "›", render: viewMeetings },
  mail: { label: "リマインドメール", icon: "›", render: viewMail },
  import: { label: "議事録の取り込み", icon: "›", render: viewImport },
};
/* 管理者以外は自分宛の通知だけを見るので、ナビの文言を変える */
const mailNavLabel = () => (user().role === "admin" ? "リマインドメール" : "自分に届くメール");

function renderNav() {
  const all = visible();
  const open = all.filter(isOpen);
  const mine = open.filter((t) => t.owner === state.userId).length;
  const groups = [
    { items: [["dashboard", null], ["tasks", open.length]] },
    { label: "取り込む", items: [["import", null]] },
    { label: "把握する", items: [["members", null], ["meetings", null]] },
    { label: "通知", items: [["mail", null]] },
  ];
  let html = groups.map((g) => (g.label ? `<div class="nav-label">${g.label}</div>` : "") +
    g.items.map(([key, count]) => `<button class="nav-item" data-view="${key}"${state.view === key ? ' aria-current="page"' : ""}>
      <span class="ico" aria-hidden="true">${VIEWS[key].icon}</span><span>${key === "mail" ? mailNavLabel() : VIEWS[key].label}</span>
      ${count !== null ? `<span class="count">${count}</span>` : ""}</button>`).join("")).join("");

  if (canSeeExec(user())) {
    const execCount = all.filter((t) => t.vis === "executive").length;
    html += `<div class="nav-label">役員</div>
      <button class="nav-item" data-exec="1"><span class="ico" aria-hidden="true">›</span><span>役員限定タスク</span>
      <span class="count">${execCount}</span></button>`;
  }
  html += `<div class="nav-label">自分のタスク</div>
    <button class="nav-item" data-mine="1"><span class="ico" aria-hidden="true">›</span><span>自分の未完了</span>
    <span class="count">${mine}</span></button>`;
  document.getElementById("nav").innerHTML = html;
}

function render() {
  const u = user();
  document.getElementById("greeting").textContent = `こんにちは、${u.name} さん`;
  const overdue = visible().filter(isOverdue).length;
  document.getElementById("today").textContent =
    fmtLong(TODAY) + (overdue ? `　･　期限を過ぎたタスクが ${overdue} 件あります` : "");
  document.getElementById("userpick").innerHTML = MEMBERS.map((m) =>
    `<option value="${m.id}"${m.id === state.userId ? " selected" : ""}>${esc(m.name)}（${ROLE_LABEL[m.role]}）</option>`).join("");
  renderNav();
  document.getElementById("view").innerHTML = VIEWS[state.view].render();
  renderDrawer();
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

document.getElementById("userpick").addEventListener("change", (e) => {
  state.userId = e.target.value;
  state.openTask = null;
  const u = user();
  toast(`${u.name}（${ROLE_LABEL[u.role]}）に切り替えました`);
  render();
});

document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-view]");
  if (nav) { state.view = nav.dataset.view; state.openTask = null; render(); return; }

  if (e.target.closest("[data-exec]")) {
    state.view = "tasks";
    state.filters = { q: "", owner: "", status: "all", vis: "executive" };
    render();
    return;
  }
  if (e.target.closest("[data-mine]")) {
    state.view = "tasks";
    state.filters = { q: "", owner: "me", status: "open", vis: "" };
    render();
    return;
  }

  const chip = e.target.closest("[data-meeting]");
  if (chip) { state.meeting = chip.dataset.meeting; render(); return; }

  const link = e.target.closest("[data-task]");
  if (link) { state.openTask = link.dataset.task; renderDrawer(); return; }

  if (e.target.id === "closeDrawer" || e.target.id === "overlay") {
    state.openTask = null;
    renderDrawer();
    return;
  }

  if (e.target.id === "postUpdate") {
    const t = TASKS.find((x) => x.code === state.openTask);
    const body = document.getElementById("upBody").value.trim();
    const status = document.getElementById("upStatus").value;
    if (!body && status === t.status) { toast("コメントか状況の変更を入力してください"); return; }
    if (body) t.log.push({ by: state.userId, d: 0, body });
    t.status = status;
    t.reported = 0;
    toast("進捗を報告しました");
    render();
    return;
  }


  if (e.target.id === "runExtract") {
    state.importBody = document.getElementById("impBody").value;
    const base = document.getElementById("impDate").value || ymd(TODAY);
    if (!state.importMeeting) { toast("会議名を選んでください"); return; }
    if (!state.importBody.trim()) { toast("議事録を貼り付けるかファイルを置いてください"); return; }
    state.importRows = extractFromMinutes(state.importBody, base);
    render();
    return;
  }

  if (e.target.id === "commitImport") {
    const selected = (state.importRows || []).filter((r) => r.include && r.title.trim());
    if (!selected.length) { toast("登録するタスクを選んでください"); return; }
    const base = document.getElementById("impDate") ? document.getElementById("impDate").value : ymd(TODAY);
    for (const row of selected) {
      TASKS.push({
        code: "T-" + String(TASKS.length + 1).padStart(4, "0"),
        title: row.title.trim(),
        owner: row.ownerId || null,
        due: row.due ? Math.round((new Date(row.due + "T12:00:00Z") - TODAY) / DAY) : null,
        status: "not_started",
        vis: state.importVisibility,
        meeting: state.importMeeting,
        mtg: Math.round((new Date(base + "T12:00:00Z") - TODAY) / DAY),
        reported: 0,
        desc: "議事録より作成: " + row.raw,
        log: [],
      });
    }
    state.importRows = null;
    state.importFileName = null;
    toast(selected.length + "件のタスクを登録しました");
    state.view = "tasks";
    state.filters = { q: "", owner: "", status: "open", vis: "" };
    render();
    return;
  }

  if (e.target.id === "addTask") {
    const title = document.getElementById("nt").value.trim();
    if (!title) { toast("タスク名を入力してください"); return; }
    const dueInput = document.getElementById("nd").value;
    const due = dueInput ? Math.round((new Date(dueInput + "T12:00:00") - TODAY) / DAY) : null;
    const visSel = document.getElementById("nv");
    TASKS.push({
      code: "T-" + String(TASKS.length + 1).padStart(4, "0"),
      title, owner: document.getElementById("no").value || null, due,
      status: "not_started", vis: visSel ? visSel.value : "all",
      meeting: document.getElementById("nm").value.trim() || "（MTG未設定）",
      mtg: 0, reported: 0, desc: "", log: [],
    });
    toast("タスクを登録しました");
    render();
  }
});


/** 会議を選ぶと、その会議の既定の公開範囲に合わせる（役員会なら役員限定）。 */
function chooseMeeting(name) {
  state.importMeeting = name;
  const found = MEETING_TYPES.find((m) => m.name === name);
  if (found) state.importVisibility = found.visibility;
  render();
}

/** 議事録ファイルを読み込む。ファイル名から日付と会議名も拾う。 */
async function readMinutesFile(file) {
  if (!file) return;
  const text = await file.text();
  state.importBody = text;
  state.importRows = null;
  state.importFileName = file.name;

  const name = file.name.replace(/\.(md|txt|markdown)$/i, "");
  const matched = name.match(/^(\d{4}-\d{2}-\d{2})[-_ ](.+)$/);
  const hit = MEETING_TYPES.find((m) => name.includes(m.name) || text.includes(m.name));
  if (hit) {
    state.importMeeting = hit.name;
    state.importVisibility = hit.visibility;
  }
  render();
  if (matched) {
    const dateInput = document.getElementById("impDate");
    if (dateInput) dateInput.value = matched[1];
  }
  toast(file.name + " を読み込みました");
}

/* 抽出結果の編集。再描画で入力欄が作り直されるため、値は state に持たせる。 */
function updateImportRow(el) {
  const index = Number(el.dataset.row);
  const field = el.dataset.field;
  if (!state.importRows || !state.importRows[index]) return;
  state.importRows[index][field] = el.type === "checkbox" ? el.checked : el.value;
}

document.addEventListener("input", (e) => {
  if (e.target.dataset && e.target.dataset.row) { updateImportRow(e.target); return; }
  if (e.target.id === "impBody") { state.importBody = e.target.value; state.importFileName = null; return; }
  if (e.target.id === "fq") {
    state.filters.q = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const again = document.getElementById("fq");
    again.focus();
    again.setSelectionRange(pos, pos);
  }
});
document.addEventListener("change", (e) => {
  if (e.target.dataset && e.target.dataset.row) { updateImportRow(e.target); return; }
  if (e.target.id === "impMeeting") { chooseMeeting(e.target.value); return; }
  if (e.target.id === "impVis") { state.importVisibility = e.target.value; return; }
  if (e.target.id === "impFile") { void readMinutesFile(e.target.files && e.target.files[0]); return; }
  if (e.target.id === "fowner") { state.filters.owner = e.target.value; render(); }
  if (e.target.id === "fstatus") { state.filters.status = e.target.value; render(); }
  if (e.target.id === "fvis") { state.filters.vis = e.target.value; render(); }
});
/* ファイルのドラッグ＆ドロップ。描画のたびに要素が作り直されるので、
   個別の要素ではなく document 側で受ける。 */
document.addEventListener("dragover", (e) => {
  if (!e.target.closest || !e.target.closest("#dropzone")) return;
  e.preventDefault();
  if (!state.dragging) { state.dragging = true; render(); }
});
document.addEventListener("dragleave", (e) => {
  if (!e.target.closest || !e.target.closest("#dropzone")) return;
  if (state.dragging) { state.dragging = false; render(); }
});
document.addEventListener("drop", (e) => {
  if (!e.target.closest || !e.target.closest("#dropzone")) return;
  e.preventDefault();
  state.dragging = false;
  void readMinutesFile(e.dataTransfer.files && e.dataTransfer.files[0]);
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.openTask) { state.openTask = null; renderDrawer(); }
});

render();
</script>
