<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0A">
<title>NARU FIT DAILY</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="NARU FIT DAILY">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ── ロゴに合わせた欧文書体 Saira（可変フォント・自己ホスト） ── */
@font-face{font-family:"Saira";src:url("fonts/saira-normal.woff2") format("woff2");
  font-weight:100 900;font-stretch:50% 125%;font-style:normal;font-display:swap}
@font-face{font-family:"Saira";src:url("fonts/saira-italic.woff2") format("woff2");
  font-weight:100 900;font-stretch:50% 125%;font-style:italic;font-display:swap}
:root{
  --bg-top:#0B0B0A; --bg-bottom:#101207;
  --panel:#1C2113;
  --surface:#15180E; --surface-alt:#1D2213; --surface-sunk:#0D0F07;
  --ink:#F1F5E4; --ink-soft:#AFB89A; --ink-mute:#767E64;
  --olive:#CAFF3C; --olive-dark:#DBFF7A; --olive-soft:#28320F;
  --orange-a:#CAFF3C; --orange-b:#A9E022;
  --tan:#CAFF3C;
  --line:#2B3020;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --safe:env(safe-area-inset-bottom,0px);
  --nav-h:60px;
  --jp:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  --font:"Saira",var(--jp);
  --f-dis:"Saira","Arial Narrow",Impact,var(--jp);   /* ロゴのワードマーク（極太・斜体・コンデンス） */
  --f-lab:"Saira",var(--jp);                          /* ロゴの細いラベル（BETTER LIFE / SINCE 2026） */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:var(--font); color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 22%,var(--bg-bottom) 78%) fixed;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}

/* ── アプリの外枠 ── */
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:520px){
  body{background:#050504 fixed}
  #app{background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-top) 22%,var(--bg-bottom) 78%);
       box-shadow:0 0 0 1px rgba(226,236,206,.08),0 30px 70px -40px rgba(226,236,206,.55)}
}
.screen{flex:1;min-height:0;display:none;flex-direction:column;animation:fade .28s ease both}
.screen.on{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pad{padding:0 18px}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}

/* ── 共通パーツ ── */
.eyebrow{font-size:9.5px;letter-spacing:.085em;font-weight:700;color:var(--ink-mute);text-transform:uppercase}
.h1{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.25;margin:6px 0 0}
.sub{font-size:13px;color:var(--ink-mute);margin:6px 0 0;line-height:1.6}
.card{background:var(--surface);border:1px solid rgba(226,236,206,.07);border-radius:var(--r-lg);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;
     border-radius:var(--r-md);font-weight:700;font-size:15px;transition:.15s}
.btn-olive{background:var(--olive);color:#0B0B0A}
.btn-olive:active{background:var(--olive-dark)}
.btn-olive:disabled{background:var(--surface-sunk);color:var(--ink-mute);cursor:default}
.btn-ghost{background:var(--surface);border:1px solid rgba(226,236,206,.08);color:var(--ink)}
.btn-dark{background:var(--panel);color:var(--ink)}
.btn-orange{background:linear-gradient(100deg,var(--orange-a),var(--orange-b));color:#0B0B0A;
            box-shadow:0 8px 20px -10px rgba(211,95,45,.9)}
.btn-tan{background:var(--tan);color:#0B0B0A}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);
      border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;letter-spacing:.06em}
.badge{display:inline-block;background:var(--olive);color:#0B0B0A;font-size:9px;font-weight:800;
       letter-spacing:.1em;padding:3px 8px;border-radius:5px}
.divider{height:1px;background:rgba(244,240,234,.16);margin:14px 0}

/* ── ヘッダー ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.logo{font-size:11px;font-weight:800;letter-spacing:.18em;white-space:nowrap}

/* ── ボトムナビ ── */
.nav{flex:none;height:calc(var(--nav-h) + var(--safe));padding-bottom:var(--safe);
     display:flex;background:rgba(10,11,8,.94);backdrop-filter:blur(10px);
     border-top:1px solid var(--line)}
.nav.hide{display:none}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink-mute)}
.nav button.on{color:var(--ink)}
.nav .en{font-size:13px;font-weight:800;letter-spacing:.08em}
.nav .ja{font-size:10px}

/* ── 診断 ── */
.step-dots{display:flex;gap:6px;justify-content:center;margin:18px 0}
.step-dots i{width:7px;height:7px;border-radius:999px;background:#c9c4b5;transition:.2s}
.step-dots i.on{width:20px;background:var(--olive)}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid transparent;
     border-radius:var(--r-lg);padding:15px 17px;margin-bottom:10px;transition:.15s}
.opt:active{transform:scale(.99)}
.opt.on{background:var(--olive-soft);border-color:var(--olive)}
.opt b{display:block;font-size:16px;font-weight:700}
.opt span{display:block;font-size:12.5px;color:var(--ink-mute);margin-top:3px}

/* ── ホーム ── */
.hero{position:relative;overflow:hidden;background:var(--panel);color:var(--ink);border-radius:var(--r-lg);padding:18px}
.hero .orb{position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:999px;
           background:rgba(115,125,88,.35)}
.hero .day{font-size:9px;letter-spacing:.18em;font-weight:700;color:rgba(244,240,234,.65)}
.hero h2{margin:5px 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.hero .by{display:inline-block;margin-top:10px;background:rgba(244,240,234,.13);border-radius:999px;
          padding:5px 12px;font-size:10px;font-weight:600}
.hero .by b{font-weight:800;letter-spacing:.06em}
.stats{display:flex;gap:9px;margin-top:11px}
.stat{flex:1;background:var(--surface);border:1px solid rgba(226,236,206,.07);border-radius:var(--r-md);
      padding:12px 6px;text-align:center}
.stat .v{font-size:22px;font-weight:800;line-height:1}
.stat .v small{font-size:12px;color:var(--ink-mute);font-weight:700}
.stat .k{font-size:9.5px;letter-spacing:.11em;font-weight:700;color:var(--ink-mute);margin-top:5px}
.seg{display:flex;gap:9px;margin-top:11px}
.seg button{flex:1;background:var(--surface);border:1.5px solid transparent;border-radius:var(--r-md);
            padding:11px 4px;text-align:center;transition:.15s}
.seg button.on{background:var(--olive-soft);border-color:var(--olive)}
.seg button.soon,.seg-dark button.soon{opacity:.38;cursor:default}
.levelhint{margin:8px 0 0;font-size:11.5px;text-align:center;color:rgba(241,245,228,.5)}
.opt.soon{opacity:.4;cursor:default}
.seg b{display:block;font-size:14px;font-weight:800}
.seg span{display:block;font-size:10.5px;color:var(--ink-mute);margin-top:2px}
.weekstrip{display:flex;gap:5px;margin-top:11px}
.weekstrip div{flex:1;border-radius:9px;background:var(--surface);border:1px solid rgba(226,236,206,.06);
               padding:7px 0;text-align:center;font-size:10px;color:var(--ink-mute);font-weight:700}
.weekstrip div.done{background:var(--olive);border-color:var(--olive);color:#0B0B0A}
.weekstrip div.today{border-color:var(--ink)}
.weekstrip div i{display:block;font-style:normal;font-size:12px;margin-top:2px}

/* 動画枠 */
.video{margin-top:11px;border-radius:var(--r-lg);overflow:hidden;background:var(--surface);
       border:1px solid rgba(226,236,206,.07)}
.video .frame{position:relative;aspect-ratio:16/11;background:linear-gradient(150deg,#3a3f31,#22251d);
              display:grid;place-items:center}
.video .frame video{width:100%;height:100%;object-fit:cover}
.video .play{width:56px;height:56px;border-radius:999px;background:rgba(244,240,234,.92);display:grid;place-items:center}
.video .play::after{content:"";border-left:16px solid var(--ink);border-top:10px solid transparent;
                    border-bottom:10px solid transparent;margin-left:4px}
.video .tag{position:absolute;top:10px;right:10px;background:rgba(11,11,10,.74);color:var(--ink);
            border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:700}
.video .cap{padding:12px 14px}
.video .cap b{font-size:13.5px}
.video .cap p{margin:3px 0 0;font-size:11.5px;color:var(--ink-mute)}
.note{margin-top:11px;background:var(--surface);border:1px solid rgba(226,236,206,.07);
      border-radius:var(--r-lg);padding:14px 16px}
.note .k{font-size:10.5px;letter-spacing:.14em;font-weight:800;color:var(--ink-mute)}
.note p{margin:6px 0 0;font-size:13.5px;line-height:1.7}

/* ── TRAIN ── */
.partline{display:flex;align-items:center;gap:9px;margin:20px 0 10px;font-size:10px;
          font-weight:700;letter-spacing:.12em;color:rgba(244,240,234,.82)}
.partline .hr{flex:1;height:1px;background:rgba(244,240,234,.16)}
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);
       color:var(--ink);border-radius:var(--r-md);padding:13px 15px;margin-bottom:8px;transition:.15s}
.exrow:active{transform:scale(.995)}
.exrow .nm{flex:1;min-width:0}
.exrow .nm{display:flex;flex-direction:column}
.exrow .en{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.exrow .ja{display:block;font-size:10px;color:var(--ink-mute);margin-top:2px;line-height:1.4}
.exrow .dose{font-size:11px;font-weight:700;white-space:nowrap;color:var(--ink-soft)}
.exrow .chev{color:var(--ink-mute);font-size:15px}
.trainwrap{position:relative;overflow:hidden;background:var(--panel);border-radius:var(--r-lg);padding:18px;color:var(--ink)}

/* ── 実行 ── */
.check{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--surface);
       border-radius:var(--r-md);padding:13px 15px;margin-bottom:8px;transition:.15s}
.check .box{width:24px;height:24px;border-radius:999px;border:1.5px solid #c3bfae;flex:none;margin-top:1px;
            display:grid;place-items:center;transition:.15s}
.check.on .box{background:var(--olive);border-color:var(--olive);color:#0B0B0A}
.check.on .en{text-decoration:line-through;color:var(--ink-mute)}
.check{color:var(--ink)}
.check .en{display:block;font-size:12.5px;font-weight:700;line-height:1.35}
.check .ja{display:block;font-size:10px;color:var(--ink-mute);margin-top:2px}
.check .dose{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:4px;font-weight:600}
.progress{height:5px;border-radius:999px;background:var(--surface-sunk);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--olive);border-radius:999px;transition:width .3s}

/* ── タイマー ── */
.timer{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 24px}
.timer .lbl{font-size:12px;letter-spacing:.14em;font-weight:800;color:var(--olive)}
.timer h2{margin:8px 0 0;font-size:24px;font-weight:800}
.timer .ja2{font-size:13px;color:var(--ink-mute);margin-top:3px}
.timer .num{font-size:66px;font-weight:800;letter-spacing:-.02em;margin:14px 0 0;line-height:1}
.timer .cues{margin-top:18px;width:100%;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;text-align:left}
.timer .cues li{font-size:13px;line-height:1.7;margin-left:-8px}
.tctl{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px 18px calc(18px + var(--safe))}
.tctl .rnd{width:52px;height:52px;border-radius:999px;background:var(--surface);border:1px solid rgba(226,236,206,.08);
           display:grid;place-items:center;font-size:17px}
.tctl .main{flex:1;max-width:170px}

/* ── LOG ── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;border-radius:9px;background:var(--surface-sunk);display:grid;place-items:center;
         font-size:11.5px;color:var(--ink-mute)}
.cal div.done{background:var(--olive);color:#0B0B0A;font-weight:700}
.cal div.today{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink)}
.cal div.done.today{color:#0B0B0A}
.sess{display:flex;align-items:center;justify-content:space-between;background:var(--surface);
      border-radius:var(--r-md);padding:13px 15px;margin-bottom:8px}
.sess b{font-size:14px}.sess span{display:block;font-size:11.5px;color:var(--ink-mute);margin-top:2px}

/* ── シート／モーダル ── */
.backdrop{position:fixed;inset:0;background:rgba(6,7,4,.62);z-index:60;display:none;
          align-items:flex-end;justify-content:center;padding:0}
.backdrop.on{display:flex}
.sheet{width:100%;max-width:430px;max-height:86dvh;overflow-y:auto;background:var(--surface-alt);
       border-radius:22px 22px 0 0;padding:20px 18px calc(24px + var(--safe));animation:up .3s cubic-bezier(.22,1,.36,1) both}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:999px;background:#cfcabb;margin:0 auto 14px}
.modal{margin:auto 18px;max-width:360px;background:var(--surface-alt);border-radius:22px;padding:26px 22px;
       text-align:center;animation:up .3s cubic-bezier(.22,1,.36,1) both}
.backdrop.center{align-items:center}
.detail-sec{margin-top:16px}
.detail-sec h4{margin:0 0 7px;font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--ink-mute)}
.detail-sec ul{margin:0;padding-left:18px}
.detail-sec li{font-size:13.5px;line-height:1.75;margin-bottom:3px}
.dot-o::marker{color:var(--olive)}
.dot-r::marker{color:var(--orange-b)}

/* ── LP ── */
.lp{flex:1 0 auto;display:flex;flex-direction:column;padding:20px 22px 0}
.lp-top{flex:none;margin-top:auto}
.lp .hero-t{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.45;margin:12px 0 0}
.about{flex:none;border-top:1px solid rgba(226,236,206,.1);margin-top:auto;padding:22px 0 5px}
.about li:last-child{margin-bottom:0}
.about li{display:flex;gap:9px;margin-bottom:11px;list-style:none}
.about b{display:block;font-size:11px;font-weight:700}
.about span{display:block;font-size:9.5px;color:var(--ink-mute);margin-top:2px}
.about .ck{color:var(--olive);font-weight:800}
</style>
</head>
<body>
<div id="app"></div>
<div class="backdrop" id="backdrop"></div>
<script>
/* =========================================================================
   種目ライブラリ
   video は naru の実演動画。撮影できたら
     video:{src:"videos/deadlift.mp4", poster:"videos/deadlift.jpg"}
   に差し替えるだけで、種目詳細と実行画面に自動で出ます。
   ========================================================================= */
const EX = {
  /* ---- ウォームアップ / コンディショニング ---- */
  "star-jump":{en:"Star Jump",ja:"スタージャンプ",video:{src:"videos/star-jump.mp4",poster:"videos/star-jump.jpg"},
    cues:["手足を同時に大きく開く","膝を軽く曲げてやわらかく着地する"],
    miss:["腕が上がりきらない","かかとから硬く着地する"],breath:"リズムよく吸って吐く"},
  "plank-hold":{en:"Plank Hold",ja:"プランク",video:{src:"videos/plank-hold.mp4",poster:"videos/plank-hold.jpg"},
    cues:["肘は肩の真下","頭からかかとまで一直線","お尻を締めて骨盤を立てる"],
    miss:["腰が落ちる","お尻が高く上がる","呼吸を止める"],breath:"止めずに細く長く吐き続ける"},
  "v-up":{en:"V-up",ja:"V字腹筋",video:{src:"videos/v-up.mp4",poster:"videos/v-up.jpg"},
    cues:["上体と脚を同時に持ち上げてVをつくる","手は足先へ伸ばす"],
    miss:["反動で起き上がる","首だけ引き上げる"],breath:"上げるときに吐く"},
  "cat-cow":{en:"Cat & Cow",ja:"キャット＆カウ",video:null,
    cues:["手は肩の真下、膝は股関節の真下","背骨を1本ずつ動かすようにゆっくり"],
    miss:["腰だけで反る","動きが速すぎる"],breath:"反るときに吸い、丸めるときに吐く"},
  "world-greatest":{en:"World's Greatest Stretch",ja:"ワールドグレイテストストレッチ",video:{src:"videos/world-greatest.mp4",poster:"videos/world-greatest.jpg"},
    cues:["前足の内側に肘を落とす","胸を開いて天井へ手を伸ばす"],
    miss:["後ろ足の膝が落ちる","背中が丸まる"],breath:"開くときに吐く"},
  "hip-circle":{en:"Hip Circle",ja:"ヒップサークル",video:null,
    cues:["足は肩幅、手は腰に","股関節から大きく円を描く"],
    miss:["膝だけ動いている","上半身が振られる"],breath:"自然な呼吸"},
  "arm-circle":{en:"Arm Circle",ja:"アームサークル",video:null,
    cues:["肩の力を抜いて大きくゆっくり","肩甲骨から動かす"],
    miss:["首をすくめる","速さだけ追う"],breath:"止めない"},
  "air-squat":{en:"Air Squat",ja:"エアスクワット",video:{src:"videos/air-squat.mp4",poster:"videos/air-squat.jpg"},
    cues:["お尻を後ろに引きながら下ろす","膝とつま先の向きを揃える"],
    miss:["膝が内に入る","かかとが浮く"],breath:"下ろすとき吸い、立つとき吐く"},
  "high-knee":{en:"High Knees",ja:"ハイニー",video:null,
    cues:["ももを腰の高さまで","つま先着地でリズムよく"],
    miss:["前かがみになる","膝が上がりきらない"],breath:"短く速く吐く"},
  "mountain-climber":{en:"Mountain Climber",ja:"マウンテンクライマー",video:null,
    cues:["肩の真下に手、体は一直線","膝を胸に素早く引き寄せる"],
    miss:["お尻が上下に跳ねる","肩が手より前に出る"],breath:"短く速く吐く"},
  "jump-rope":{en:"Single Unders",ja:"なわとび",video:null,
    cues:["脇を締めて手首で回す","小さく跳ぶ"],
    miss:["腕全体で回す","高く跳びすぎる"],breath:"リズムよく"},
  "double-unders":{en:"Double Unders",ja:"二重跳び",video:null,
    cues:["1回目より少しだけ高く跳ぶ","手首のスナップを速く"],
    miss:["脚を後ろに蹴り上げる","腕が体から離れる"],breath:"跳ぶリズムに合わせて短く"},
  "burpee":{en:"Burpee",ja:"バーピー",video:null,
    cues:["1つ1つの動作を丁寧に","きつければジャンプを省いてよい"],
    miss:["腰が反ったままプランクに入る","フォームが崩れても回数を追う"],breath:"立ち上がるときに吐く"},
  "skater":{en:"Skater",ja:"スケーター",video:{src:"videos/skater.mp4",poster:"videos/skater.jpg"},
    cues:["横に大きく跳んで片脚で着地","1秒静止できる強さで"],
    miss:["膝が内に入る","上体が起きすぎる"],breath:"跳ぶたびに吐く"},
  "row-machine":{en:"Row",ja:"ローイング",video:null,
    cues:["脚→体幹→腕の順に引く","戻すときは腕→体幹→脚"],

/* =========================================================================
   言語（日本語 / English）
   TXT に ja と en を並べて持つ。TX("key") で今の言語の文を返し、
   en に無いキーは ja に落ちるので、訳の途中でも画面は壊れない。
   TX("key", a, b) の a,b は文中の {0}{1} に入る。
   ========================================================================= */
/* 英語版は作ってあるが、naru さんのチェックが済むまでは出さない。
   見せるときは SHOW_LANG を true にするだけでよい */
const SHOW_LANG = false;

/* 実演動画の一覧画面。いまはメニューの中からだけ見せる。
   一覧を出したくなったら true に戻す */
const SHOW_VIDEO_LIST = false;

const LANGS = [["ja","日本語"],["en","English"]];
function lang(){
  if(!SHOW_LANG) return "ja";
  if(S.lang==="ja" || S.lang==="en") return S.lang;
  try{ return String(navigator.language||"ja").toLowerCase().startsWith("ja") ? "ja" : "en"; }
  catch(e){ return "ja"; }
}
function setLang(v){ S.lang = (v==="en"?"en":"ja"); save(); render(); }
function TX(k){
  const d = TXT[lang()] || TXT.ja;
  let v = (k in d) ? d[k] : TXT.ja[k];
  if(v==null) return k;
  for(let i=1;i<arguments.length;i++) v = v.split("{"+(i-1)+"}").join(arguments[i]);
  return v;
}
const TXT = { ja:{}, en:{} };
function addTxt(map){ for(const k in map){ TXT.ja[k]=map[k][0]; TXT.en[k]=map[k][1]; } }

/* 英語のときの処方表記。日本語まじりの指示だけを置き換える */
function doseEn(d){
  return String(d)
    .replace(/左右各\s*(\d+)\s*(rep|sec)/g, "$1 $2 each side")
    .replace(/左右交互\s*(\d+)\s*(rep|sec)/g, "$1 $2 alternating")
    .replace(/　?※\s*加重／ラットプルダウンでも可/g, " \u00b7 weighted or lat pulldown is fine")
    .replace(/（フォーム確認）/g, " (form check)")
    .replace(/（補助あり）/g, " (assisted)")
    .replace(/（左右）/g, " each side");
}

  const e = EX[id]; if(!e) return k==="breath" ? "" : [];
  if(lang()==="en" && EX_EN[id] && EX_EN[id][k]) return EX_EN[id][k];
  return e[k];

function dayTx(o, k){
  if(!o) return "";
  if(lang()==="en" && o[k+"En"]) return o[k+"En"];

/* ---- 2週間（14日）サイクル -------------------------------------------- */
const CYCLE = 14, WEEK = 7;

const addDays = (k,n) => { const d=new Date(k+"T00:00:00"); d.setDate(d.getDate()+n); return dkey(d); };
const dayDiff = (a,b) => Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00"))/86400000);

/* いま選んでいる Fit レベル。内容がまだ無い Fit 2 は Fit 1 に落とす */
function fit(){ const v=level(); return (PROGRAM[v] && PROGRAM[v].length) ? v : "fit1"; }

/* サイクル（DAY 1〜14）は Fit レベルと切り離す。
   その日の調子で Fit を上げ下げしても、日数は進んだまま */
function newCycle(start){
  return { v:2, start:start, plan:Array.from({length:CYCLE},(_,i)=>i) };
}
function ensureCycle(){
  let moved=false;
  if(!S.cycle || !S.cycle.start || !S.cycle.plan){ S.cycle=newCycle(todayKey()); moved=true; }
  /* 旧データ（7日ぶんを2周する plan）を 14日ぶんの plan に作り直す */
  if(S.cycle.v!==2){ const st=S.cycle.start; S.cycle=newCycle(st); moved=true; }
  let d=dayDiff(S.cycle.start, todayKey());
  if(d<0){ S.cycle=newCycle(todayKey()); d=0; moved=true; }
  let guard=0;
  while(d>=CYCLE && guard++<400){
    S.cycles=S.cycles||[]; S.cycles.push(cycleSummary());
    S.cycle=newCycle(addDays(S.cycle.start,CYCLE));
    d=dayDiff(S.cycle.start, todayKey()); moved=true;
  }
  if(moved) save();
}
/* n 日目（1〜14）のプログラム。
   14日ぶん用意してある Fit（Fit 1）はそのまま、7日ぶんの Fit（Fit 3）は2周する */
function dayOf(n){
  ensureCycle();
  if(n<1 || n>CYCLE) return null;
  const list = PROGRAM[fit()] || PROGRAM.fit1;
  return list[S.cycle.plan[n-1] % list.length] || null;
}
function cycleDates(){ return Array.from({length:CYCLE},(_,i)=>addDays(S.cycle.start,i)); }
function cycleSummary(){
  const list = PROGRAM[fit()] || PROGRAM.fit1;
  const need = S.cycle.plan.filter(i => !(list[i % list.length]||{}).rest).length;
  const did  = cycleDates().filter(k=>S.logs.some(l=>l.date===k)).length;
  return {start:S.cycle.start, end:addDays(S.cycle.start,CYCLE-1), need:need, did:did};
}
function cycleDay(){ ensureCycle(); return dayDiff(S.cycle.start,todayKey())+1; }
const dayTitle = n => { const d=dayOf(n); return d ? d.t : ""; };

/* 今日より後ろにある完全休養日。これが振り替えの残り回数になる */
function restAhead(){
  const n=cycleDay(), out=[];
  for(let i=n+1;i<=CYCLE;i++){ const d=dayOf(i); if(d && d.rest) out.push(i); }
  return out;
}
function swapToRest(){
  const n=cycleDay(), t=restAhead()[0]; if(!t) return;
  const p=S.cycle.plan, tmp=p[n-1]; p[n-1]=p[t-1]; p[t-1]=tmp;
  save(); render();
}

/* S.sets = { 種目ID: [ {d:"2026-10-30", w:120, r:6}, ... ] } */

/* 今日より前で、いちばん新しい日の記録をまとめて返す */
function prevSession(x){
  const a = (S.sets && S.sets[x]) || [];
  const today = todayKey();
  let d = null;
  for(let i=a.length-1;i>=0;i--){ if(a[i].d !== today){ d = a[i].d; break; } }
  if(!d) return null;
  return { d:d, list:a.filter(e=>e.d===d) };
}
const fmtSet = e =>
  ((e.w!=null && e.w!=="") ? e.w+"kg" : TX("ent.bw")) + (e.r!=null ? " × "+e.r : "");
const mmdd = d => d.slice(5).replace("-","/");

/* 実行画面の入力欄を読んで保存する */
function logCurrentSet(){
  const f = T.flow[T.i];
  if(!f || f.sec) return;
  const wEl = document.getElementById("in-w"), rEl = document.getElementById("in-r");
  if(!wEl && !rEl) return;
  const w = (wEl && wEl.value !== "") ? parseFloat(wEl.value) : null;
  const r = (rEl && rEl.value !== "") ? parseInt(rEl.value,10) : null;
  if(w==null && r==null) return;
  if(w!=null && !isFinite(w)) return;
  S.sets = S.sets || {};
  (S.sets[f.x] = S.sets[f.x] || []).push({d:todayKey(), w:w, r:r});
  save();
}

/* 実行画面に出す「前回の記録」。入力はしない（記録はトレーニング後にまとめて） */
function setlogBlock(f){
  const ps = prevSession(f.x);
  if(!ps) return "";
  return `<div class="setlog">
    <div class="prevline">${TX("ent.prev")} ${mmdd(ps.d)} ・ <b>${esc(ps.list.map(fmtSet).join("　"))}</b></div>
  </div>`;
}

/* 種目の解説シートに出す履歴 */
function historyBlock(id){
  const a = (S.sets && S.sets[id]) || [];
  if(!a.length) return "";
  const byDay = {};
  a.forEach(e=>{ (byDay[e.d] = byDay[e.d] || []).push(e); });
  const days = Object.keys(byDay).sort().reverse().slice(0,6);
  return `<div class="detail-sec"><h4>${TX("ex.history")}</h4>
    <table class="hist">${days.map(d=>
      `<tr><td>${mmdd(d)}</td><td>${esc(byDay[d].map(fmtSet).join("　"))}</td></tr>`).join("")}</table></div>`;
}

function streak(){
  const set = new Set(S.logs.map(l=>l.date));
  if(!set.size) return 0;
  let n=0; const c=new Date();
  if(!set.has(dkey(c))){ c.setDate(c.getDate()-1); if(!set.has(dkey(c))) return 0; }
  while(set.has(dkey(c))){ n++; c.setDate(c.getDate()-1); }
  return n;
}
function thisWeekCount(){
  const now=new Date(); const start=new Date(now); start.setDate(now.getDate()-now.getDay());
  return S.logs.filter(l=> new Date(l.date+"T00:00:00") >= new Date(dkey(start)+"T00:00:00")).length;
}

function saveEntry(){
  const p=todayProgram(); if(!p) return;
  const today=todayKey();
  S.sets=S.sets||{}; S.amraps=S.amraps||{};
  /* 今日ぶんを一度消してから入れ直す（タイマーと二重に記録されるのを防ぐ） */
  Object.keys(S.sets).forEach(k=>{
    S.sets[k]=S.sets[k].filter(e=>e.d!==today); if(!S.sets[k].length) delete S.sets[k];
  });
  Object.keys(S.amraps).forEach(k=>{
    S.amraps[k]=S.amraps[k].filter(e=>e.d!==today); if(!S.amraps[k].length) delete S.amraps[k];
  });
  p.parts.forEach((part,pi)=>{
    if(part.k==="AMRAP"){
      const el=document.getElementById("a"+pi+"-x");
      if(el && el.value!==""){
        const key=p.t+"|"+pi;
        (S.amraps[key]=S.amraps[key]||[]).push({d:today, r:parseInt(el.value,10)});
      }
      return;
    }
    part.items.forEach((it,ii)=>{
      const w=document.getElementById("e"+pi+"-"+ii+"-w"), r=document.getElementById("e"+pi+"-"+ii+"-r");
      if(!w && !r) return;
      const wv=(w && w.value!=="") ? parseFloat(w.value) : null;
      const rv=(r && r.value!=="") ? parseInt(r.value,10) : null;
      if(wv==null && rv==null) return;
      (S.sets[it.x]=S.sets[it.x]||[]).push({d:today, w:wv, r:rv});
    });
  });

  /* 追加でやった種目。登録ずみの種目名と一致したら履歴にも積む */
  entryRead();
  S.extras=S.extras||{}; S.memo=S.memo||{};
  const ext=[];
  (entryExtras||[]).forEach(e=>{
    const nm=String(e.name||"").trim(); if(!nm) return;
    const wv = e.w!=="" ? parseFloat(e.w) : null;
    const rv = e.r!=="" ? parseInt(e.r,10) : null;
    const x  = matchEx(nm);
    ext.push(x ? {name:nm, w:wv, r:rv, x:x} : {name:nm, w:wv, r:rv});
    if(x && (wv!=null || rv!=null)) (S.sets[x]=S.sets[x]||[]).push({d:today, w:wv, r:rv});
  });
  if(ext.length) S.extras[today]=ext; else delete S.extras[today];
  const mm=String(entryMemo||"").trim();
  if(mm) S.memo[today]=mm; else delete S.memo[today];

  save();
  entryExtras=null; entryMemo=null;
  completeToday();
}

/* =========================================================================
   実行：タイマー
   ========================================================================= */
function parseDose(d){
  const sec=/(\d+)\s*sec/.exec(d), sets=/×\s*(\d+)\s*set/.exec(d), reps=/(\d+)\s*rep/.exec(d);
  return {sec:sec?+sec[1]:null, sets:sets?+sets[1]:1, reps:reps?+reps[1]:null};
}
function buildFlow(p){
  const flow=[];
  p.parts.forEach((part,pi)=>{
    /* AMRAP は「12分でできるだけ多く」なので、ひとかたまりで1ステップにする */
    if(part.k==="AMRAP"){
      const min = part.min || 12;
      flow.push({amrap:true, pi, part:"AMRAP", min, pnote:part.note||"",
        items: part.items.map(it=>({x:it.x, d:doseOf(it)})),
        x: part.items[0].x, star:false, label: min+" min AMRAP",
        round:0, rounds:1, set:0, sets:1, sec:min*60, rest:0});
      return;
    }
    const rounds=part.r||1;
    const expand = {"STRENGTH":1,"ACCESSORY":1,"TRAINING":1,"FUNCTIONAL":0};
    const restOf = {"COOL DOWN":5,"WARM UP":10,"STRENGTH":120,"ACCESSORY":60,"TRAINING":30};
    for(let r=1;r<=rounds;r++){
      part.items.forEach(it=>{
        const d=doseOf(it); if(!d || d==="—") return;
        const pd=parseDose(d);
        const sets = expand[part.k] ? pd.sets : 1;
        for(let s=1;s<=sets;s++){
          flow.push({x:it.x, star:it.star, part:part.k, pi, label:d, pnote:part.note||"",
            round:rounds>1?r:0, rounds, set:sets>1?s:0, sets,
            sec:pd.sec,
            rest: restOf[part.k]!=null ? restOf[part.k] : 20});
        }
      });
    }
  });
  return flow;
}
let T={flow:[],i:0,phase:"count",left:3,paused:false,elapsed:0,tick:null,rounds:0};

function startTimer(){
  T.flow=buildFlow(todayProgram()); T.i=0; T.phase="count"; T.left=3; T.paused=false; T.elapsed=0;
  clearInterval(T.tick);
  T.tick=setInterval(()=>{
    if(T.paused) return;
    T.elapsed++;
    if(T.phase==="count"){ T.left--; if(T.left<=0){ enterItem(0); } else updateNum(); return; }
    if(T.phase==="rest"){ T.left--; if(T.left<=0){ enterItem(T.i+1); } else updateNum(); return; }
    if(T.phase==="work"){
      const f=T.flow[T.i];
      if(f && f.sec){ T.left--; if(T.left<=0){ afterItem(); } else updateNum(); }
      else updateNum();
    }
  },1000);
}
function stopTimer(){ clearInterval(T.tick); T.tick=null; }
function enterItem(i){
  if(i>=T.flow.length){ stopTimer(); completeToday(); return; }
  T.i=i; T.phase="work"; const f=T.flow[i];
  T.left = f.sec || 0;
  if(f.amrap) T.rounds = 0;
  render();
}
function afterItem(){
  logCurrentSet(); logAmrap();
  const f=T.flow[T.i];
  if(T.i>=T.flow.length-1){ stopTimer(); completeToday(); return; }
  if(f.rest>0){ T.phase="rest"; T.left=f.rest; render(); } else enterItem(T.i+1);
}
function prevAmrap(pi){
  const p=todayProgram(); if(!p) return null;
  const a=(S.amraps && S.amraps[p.t+"|"+pi]) || [];
  const today=todayKey();
  for(let i=a.length-1;i>=0;i--) if(a[i].d!==today) return a[i];
  return null;
}
function logAmrap(){
  const f=T.flow[T.i]; if(!f || !f.amrap) return;
  const p=todayProgram(); if(!p) return;
  const key=p.t+"|"+f.pi;
  S.amraps=S.amraps||{};
  (S.amraps[key]=S.amraps[key]||[]).push({d:todayKey(), r:T.rounds||0});
  save();
}
function updateNum(){
  const f=T.flow[T.i];
  const n=document.getElementById("t-num");
  if(n) n.textContent = (f && f.amrap) ? fmtClock(T.left>0?T.left:0) : fmt(T.left>0?T.left:0);
  const b=document.getElementById("t-bar"); if(b) b.style.width=((T.i+1)/T.flow.length*100)+"%";
  const e=document.getElementById("t-el"); if(e) e.textContent = fmtClock(T.elapsed);
}

/* セット表示中は、そのセットぶんの処方だけを大きく出す */
function setLabel(f){
  return f.set ? f.label.replace(/\s*×\s*\d+\s*set/,"").trim() : f.label;
}

/* 「ROUND 1/2」「SET 2/3」 */
function stepMeta(f){
  return [ f.round?`ROUND ${f.round}/${f.rounds}`:"", f.set?`SET ${f.set}/${f.sets}`:"" ].filter(Boolean).join(" · ");
}

function stepHeader(dark){
  const pct = ((T.i+1)/T.flow.length*100);

      <span class="tnum" id="t-el">${fmtClock(T.elapsed)}</span>

}

    const key=f.pi+"|"+(f.round||0);

   有料の壁（紹介画面 → 申し込み → パスワード）
   ========================================================================= */
const ACCESS = {
  on   : true,                      // false にすると壁が外れる。社内確認や無料公開に戻すとき用
  codes: ["naru1116"],              // 有効なパスワード。月初に入れ替える
                                    // 古いものを消すと、そのパスワードの人は再入力になる
  buy  : BIZ.pay                    // 申し込みページ（Stripe）
};
function unlocked(){
  if(!ACCESS.on) return true;
  if(!S.access) return false;
  /* メールアドレスで入った人。until を過ぎていても、裏で確認している間は
     開いたままにする（確認が失敗したときに締め出さないため）。
     確認の結果ダメだったときだけ S.access を消す。 */
  if(S.access.email) return true;
  return ACCESS.codes.some(c => c.toLowerCase() === String(S.access.code).toLowerCase());
}

/* ── メールアドレスで確認する ──────────────────────────────
   返り値 "ok" / "nosub"（お申し込みが見つからない） / "err"（確認できない） */
async function checkEmail(email){
  try{
    const r = await fetch("/api/unlock", {
      method :"POST",
      headers:{"content-type":"application/json"},
      body   :JSON.stringify({email:email})
    });
    const d = await r.json().catch(()=>({}));
    if(d && d.ok){ return {r:"ok", until:d.until}; }
    if(d && d.reason==="nosub") return {r:"nosub"};
    return {r:"err"};
  }catch(e){ return {r:"err"}; }
}

/* 期限が来ていたら、裏でもう一度 Stripe に確認する。
   ・生きていれば期限を延ばすだけ（お客さんは何も気づかない）
   ・解約されていたら、そこで初めてログアウトさせる
   ・確認できなかった（圏外・サーバー不調）ときは、何もしない */
async function refreshAccess(){
  const a = S.access;
  if(!a || !a.email || !a.until || Date.now() < a.until) return;
  const res = await checkEmail(a.email);
  if(res.r==="ok"){ S.access.until = res.until; save(); return; }
  if(res.r==="nosub"){
    S.access = null; save();
    gateErr = TX("gate.emailNo"); go("gate");
  }
}
let gateVal="", gateErr="", gateMail="", gateBusy=false, gatePw=false;
function tryUnlock(v){
  const q = String(v||"").trim().toLowerCase().replace(/\s+/g,"");
  const hit = ACCESS.codes.find(c => c.toLowerCase() === q);
  if(!hit) return false;
  S.access = {code:hit, at:todayKey()}; save();
  gateVal=""; gateErr="";
  go(S.profile ? "home" : "ob");
  return true;
}

async function submitMail(){
  if(gateBusy) return;
  const el = document.getElementById("mail");
  const v  = String(el ? el.value : gateMail).trim().toLowerCase();
  gateMail = v;
  if(!/^[^@\s]+@[^@\s.]+\.[^@\s]+$/.test(v)){ gateErr = TX("gate.emailNo"); render(); return; }
  gateBusy = true; gateErr = ""; render();
  const res = await checkEmail(v);
  gateBusy = false;
  if(res.r === "ok"){
    S.access = {email:v, until:res.until, at:todayKey()}; save();
    gateMail=""; gateErr="";
    go(S.profile ? "home" : "ob");
    return;
  }
  gateErr = res.r === "nosub" ? TX("gate.emailNo") : TX("gate.emailErr");
  if(res.r !== "nosub") gatePw = true;   /* 確認できないときはパスワードの道を出す */
  render();
}

/* =========================================================================
   イベント
   ========================================================================= */
function bind(){
  const on=(sel,fn)=>app.querySelectorAll(sel).forEach(el=>el.onclick=e=>fn(el,e));

  on("[data-go]",el=>{ const t=el.dataset.go;
    if(t==="entry"){ entryExtras=null; entryMemo=null; }
    if(t!=="timer") stopTimer();
    if(t==="timer"){ stopTimer(); T.tick=null; }
    go(t);
  });
  on("[data-start]",()=>{
    if(!unlocked()){ go("gate"); return; }
    ob={step:0,goal:null,level:null,place:null,days:3}; go("ob");
  });

  /* パスワード */
  on("[data-unlock]",()=>{
    const el=document.getElementById("code"); gateVal = el ? el.value : "";
    if(!tryUnlock(gateVal)){ gateErr=TX("gate.codeErr"); render(); }
  });
  const ci=document.getElementById("code");
  if(ci) ci.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault();
    const b=app.querySelector("[data-unlock]"); if(b) b.click(); } };

  /* メールアドレスで入る */
  on("[data-pw]",()=>{ gatePw=true; gateErr=""; render(); });
  on("[data-mailgo]",()=>{ submitMail(); });
  const mi=document.getElementById("mail");
  if(mi) mi.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); submitMail(); } };

  /* 診断 */
  on("[data-ob]",el=>{
    const st=obSteps()[ob.step]; let v=el.dataset.ob;
    if(st.k==="days") v=+v;
    ob[st.k]=v; render();
  });
  on("[data-ob-next]",()=>{
    if(ob.step<obSteps().length-1){ ob.step++; render(); return; }
    S.profile={goal:ob.goal,level:ob.level,place:ob.place,days:ob.days};
    S.level=ob.level; save(); go("home");
  });
  on("[data-ob-back]",()=>{ ob.step--; render(); });

  /* 強度切り替え */
  on("[data-level]",el=>{ S.level=el.dataset.level; if(S.profile) S.profile.level=S.level; save(); render(); });

  /* 種目詳細 */
  on("[data-lang]",el=>setLang(el.dataset.lang));
  on("[data-ex]",el=>openExercise(el.dataset.ex, el.dataset.vid==="1"));

  /* 書類 */
  on("[data-legal]",el=>openLegal(el.dataset.legal));

  /* 休養日との振り替え */
  on("[data-swap]",()=>swapToRest());

  /* パスワードを入れ直す */
  on("[data-relock]",()=>{ S.access=null; save(); gateVal=""; gateMail=""; gateErr=""; go("gate"); });

  /* チェックリスト */
  on("[data-check]",(el,e)=>{
    // 「?」を押したときは解説を開く（チェックしない）
    if(e.target.closest("[data-ex]")){ const el=e.target.closest("[data-ex]"); openExercise(el.dataset.ex, el.dataset.vid==="1"); return; }
    const k=el.dataset.check; S.checks[k]=!S.checks[k]; save(); render();
    // 次の未チェック種目まで自動でスクロールする
    setTimeout(()=>{ const n=document.getElementById("next-item");
      if(n) n.scrollIntoView({behavior:"smooth",block:"center"}); },40);
  });
  on("[data-fold]",el=>{ const i=el.dataset.fold; S.folded=S.folded||{};
    S.folded[i] = S.folded[i]===false ? true : false; render(); });
  on("[data-complete]",()=>completeToday());
  on("[data-entry-save]",()=>saveEntry());
  on("[data-extra-add]",()=>{ entryRead(); entryExtras.push({name:"",w:"",r:""}); render(); });

  /* タイマー */
  on("[data-skip-count]",()=>enterItem(0));
  on("[data-rest-add]",()=>{ T.left+=20; updateNum(); });
  on("[data-rest-skip]",()=>enterItem(T.i+1));
  on("[data-t-toggle]",()=>{ const f=T.flow[T.i];
    if(f && f.sec){ T.paused=!T.paused; render(); } else afterItem(); });
  on("[data-t-next]",()=>afterItem());
  on("[data-amrap-round]",()=>{ T.rounds=(T.rounds||0)+1; render(); });
  on("[data-t-prev]",()=>{ if(T.i>0) enterItem(T.i-1); else enterItem(0); });
  on("[data-quit]",()=>{ stopTimer(); T.tick=null; go("train"); });
  on("[data-jump-open]",()=>openJump());

  /* 設定 */
  on("[data-set]",el=>{
    const k=el.dataset.set; let v=el.dataset.val;
    if(k==="lang"){ setLang(v); return; }
    if(k==="days") v=+v;
    if(!S.profile) S.profile={goal:"tone",level:"normal",place:"home",days:3};
    S.profile[k]=v; if(k==="level") S.level=v;
    save(); render();
  });
  on("[data-reset]",()=>{
    if(confirm(TX("set.resetAsk"))){
      const keepLang=S.lang;
      S={profile:null,logs:[],checks:{},level:null,sets:{},cycle:null,cycles:[],access:null,extras:{},memo:{},lang:keepLang};
      try{ localStorage.removeItem(KEY); }catch(e){}
      go("lp");
    }
  });
}

backdrop.onclick=e=>{
  const t=e.target;
  if(t===backdrop){ closeSheet(); return; }
  const c=t.closest("[data-close]"); if(c){ closeSheet(); return; }
  const r=t.closest("[data-rpe]"); if(r){ applyRpe(r.dataset.rpe); return; }
  const v=t.closest("[data-view-progress]"); if(v){ closeSheet(); stopTimer(); T.tick=null; go("log"); return; }
  const j=t.closest("[data-jump]"); if(j){ closeSheet(); enterItem(+j.dataset.jump); return; }
  const x=t.closest("[data-ex]"); if(x){ openExercise(x.dataset.ex, x.dataset.vid==="1"); return; }
};

/* =========================================================================
   起動
   ========================================================================= */
load();

/* 決済後に Stripe から ?k=パスワード 付きで戻ってきたときは、自動で解錠する。
   お客さんがパスワードをコピーしなくて済む。
   アドレスバーにパスワードが残らないよう、解錠したらURLから消す。
   ※ パスワードはもともと画面のHTMLに書いてあるので、これで安全性は変わらない */
(function autoUnlock(){
  try{
    const q = new URLSearchParams(location.search);
    const k = q.get("k") || q.get("code");
    if(!k) return;
    const ok = ACCESS.codes.find(c => c.toLowerCase() === String(k).trim().toLowerCase());
    if(ok){ S.access = {code:ok, at:todayKey()}; save(); }
    q.delete("k"); q.delete("code");
    const rest = q.toString();
    history.replaceState(null, "", location.pathname + (rest?"?"+rest:"") + location.hash);
  }catch(e){}
})();

/* 決済から戻ってきたとき、?m= にメールアドレスが付いていれば先に確認する */
(function autoMail(){
  try{
    const q = new URLSearchParams(location.search);
    const m = q.get("m") || q.get("email");
    if(!m || (S.access && S.access.email)) return;
    q.delete("m"); q.delete("email");
    const rest = q.toString();
    history.replaceState(null, "", location.pathname + (rest?"?"+rest:"") + location.hash);
    gateMail = String(m).trim().toLowerCase();
  }catch(e){}
})();

current = !unlocked() ? (S.profile ? "gate" : "lp") : (S.profile ? "home" : "lp");
render();

/* 期限が来ていれば、裏でお申し込みが続いているか確認する */
refreshAccess();

.about li{align-items:flex-start}
code{background:rgba(226,236,206,.07);border-radius:4px;padding:1px 5px;font-size:11.5px}

/* ═══ ロゴに合わせたタイポグラフィ ═══
   ・ワードマーク（NARU FIT / DAILY）= 極太・斜体・コンデンス
   ・ラベル（BETTER LIFE / SINCE 2026）= 細め・大きめの字間
   日本語はこれまで通りゴシック体（Saira に日本語が無いので自動で切り替わる） */

/* ── ワードマーク系（欧文のみの見出し） ── */
.dis,.logo,.hero h2,.timer h2,.gate h1,.daytitle{
  font-family:var(--f-dis);font-weight:900;font-style:italic;
  font-stretch:76%;letter-spacing:.012em;text-transform:uppercase}
.logo{font-size:14px;letter-spacing:.015em;font-weight:900}
.hero h2{font-size:24px;letter-spacing:.005em;margin-top:3px}
.timer h2{font-size:28px}
.gate h1{font-size:31px;letter-spacing:.005em}

/* ── 数字 ── */
.timer .num{font-family:var(--f-dis);font-weight:900;font-style:italic;
  font-stretch:78%;letter-spacing:0}
.stat .v,.gate-price .p b{font-family:var(--f-dis);font-weight:900;font-stretch:82%}
.gate-price .p b{letter-spacing:-.01em}

/* ── 細いラベル ── */
.eyebrow,.nav .en,.stat .k,.hero .day,.partline,.note .k,
.detail-sec h4,.timer .lbl,.gate-div,.gate-bonus b,.badge,.pill,.steps-h{
  font-family:var(--f-lab);font-stretch:108%;text-transform:uppercase}
.eyebrow{font-weight:500;letter-spacing:.2em;font-size:10px}
.nav .en{font-weight:600;letter-spacing:.13em;font-size:12.5px}
.stat .k{font-weight:500;letter-spacing:.18em}
.hero .day{font-weight:500;letter-spacing:.22em;font-size:9.5px}
.partline{font-weight:500;letter-spacing:.2em}
.note .k,.detail-sec h4{font-weight:700;letter-spacing:.06em}  /* 日本語ラベルなので字間は控えめ */
.timer .lbl{font-weight:600;letter-spacing:.2em}
.badge{font-weight:700;letter-spacing:.14em}
.pill{font-weight:600;letter-spacing:.12em}

/* ── ロゴ画像 ── */
.logomark{display:block;width:100%;height:auto}
.gate .logomark{max-width:236px;margin:0 0 14px}
.lp .logomark{max-width:218px;margin:0 auto 16px}


/* ── 申し込み画面：naru からのメッセージ ── */
.gate-msg{margin-top:22px;background:var(--surface);border:1px solid rgba(226,236,206,.08);
  border-radius:var(--r-lg);padding:18px 17px;overflow:hidden}
.gate-msg .photo{display:block;width:calc(100% + 34px);max-width:none;height:auto;
  margin:-18px -17px 16px;aspect-ratio:1/1;object-fit:cover;object-position:50% 18%}
.gate-msg p{margin:0 0 11px;font-size:13.5px;line-height:1.95;color:var(--ink-soft)}
.gate-msg p:first-of-type{color:var(--ink);font-weight:700;font-size:14.5px}
.gate-msg .sign{margin-top:14px;padding-top:12px;border-top:1px solid rgba(226,236,206,.08);
  font-family:var(--f-dis);font-weight:900;font-style:italic;font-stretch:76%;
  font-size:13px;letter-spacing:.02em;color:var(--olive);text-align:right}
.gate-consent{margin:10px 0 0;font-size:11.5px;line-height:1.7;text-align:center;color:var(--ink-mute)}
.gate-consent button{color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px}
.legal ul{margin:6px 0 0;padding-left:18px}
.legal li{font-size:13px;line-height:1.8;margin-bottom:2px}


/* ── その日の解説動画（縦向き・音あり） ── */
.wod{margin-top:14px;border-radius:var(--r-md);overflow:hidden;
  background:#000;border:1px solid rgba(226,236,206,.1)}
.wod video{display:block;width:100%;height:auto;max-width:none;
  aspect-ratio:1/1;object-fit:cover;object-position:50% 26%;background:#000}
.wodc{padding:11px 13px;background:var(--surface-sunk)}
.wodc b{display:block;font-size:13px;color:var(--ink)}
.wodc span{display:block;font-size:11.5px;color:var(--ink-mute);margin-top:2px;line-height:1.6}


/* ── 料金プラン（2つ並べる） ── */
.plans{display:flex;flex-direction:column;gap:11px;margin-top:11px}
.plan{position:relative;background:var(--surface);border:1.5px solid rgba(226,236,206,.13);
  border-radius:var(--r-lg);padding:17px 16px 16px}
.plan.best{border-color:var(--olive);background:rgba(202,255,60,.045)}
.ptag{position:absolute;top:-9px;right:14px;background:var(--olive);color:#0B0B0A;
  font-family:var(--f-lab);font-stretch:108%;font-weight:700;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;border-radius:4px;padding:3px 9px}
.pnm{font-size:15px;font-weight:800;letter-spacing:.01em}
.pld{font-size:12px;color:var(--ink-mute);margin-top:2px}
.ppr{display:flex;align-items:baseline;gap:3px;margin-top:11px;flex-wrap:wrap}
.ppr b{font-family:var(--f-dis);font-weight:900;font-stretch:82%;font-size:38px;line-height:1;
  color:var(--olive);letter-spacing:-.01em}
.ppr i{font-style:normal;font-size:14px;font-weight:700;color:var(--ink)}
.ppr span{font-size:12px;color:var(--ink-soft);margin-left:4px}
.ppm{font-size:11.5px;color:var(--ink-mute);margin-top:4px}
.pfe{list-style:none;margin:13px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.pfe li{position:relative;padding-left:17px;font-size:12.5px;line-height:1.65;color:var(--ink-soft)}
.pfe li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;
  border-radius:999px;background:var(--olive)}
.plan .btn{margin-top:15px;height:48px;font-size:14px}
.plan .btn[disabled]{background:var(--surface-sunk);color:var(--ink-mute);
  border:1px solid rgba(226,236,206,.08)}
.pcy{margin-top:8px;font-size:10.5px;text-align:center;color:var(--ink-mute)}


/* 先行価格のお知らせ */
.pfu{margin:13px 0 0;padding:11px 12px;background:var(--olive-soft);
  border-radius:var(--r-sm);font-size:11.5px;line-height:1.75;color:var(--olive-dark)}


/* 改定後の価格（将来価格との比較。過去の価格ではないので「通常価格」とは書かない） */
.pnx{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:9px;
  padding:8px 11px;background:var(--surface-sunk);border-radius:var(--r-sm)}
.pnx .d{font-size:11px;color:var(--ink-mute)}
.pnx b{font-family:var(--f-dis);font-weight:900;font-stretch:82%;font-size:19px;
  color:var(--ink-soft);letter-spacing:.01em}


/* LP の短いひとこと */
.lp-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}
.lp-chips span{background:var(--surface);border:1px solid rgba(226,236,206,.12);
  border-radius:999px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--ink-soft)}

</style>
</body>
