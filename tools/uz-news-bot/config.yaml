# ウズベキスタンNOW ニュース収集ボット 設定
#
# verified: true  = 実在とハンドルを確認済み
# verified: false = 未確認。t.me/s/<name> をブラウザで開いて存在を確認してから true にする

engagement:
  # 「そのチャンネルの直近投稿の中央値ビュー数」に対する比率のしきい値。
  #
  # 実測（2026-08-31）: Telegramの閲覧数は投稿ごとのバラつきが極めて小さい。
  # Kun.uz は 9,580〜10,700（±6%）に収まり、最大でも中央値の 1.09 倍だった。
  # 購読者が惰性でほぼ全投稿を見るため、内容の差が閲覧数に出ない。
  #
  # したがって「中央値の◯倍以上」を通過条件にすると、値を何にしても
  # 意味のある選別にならない。閲覧数は【足切り】ではなく【順位付け】に使い、
  # ここでは「明らかに読まれていないもの」だけを落とす下限として使う。
  # 選別の主役は下の relevance（関連度）。
  min_view_ratio: 0.85

  # 絶対数の下限。ノイズ除去が目的なので低く置く。
  # 実測: Gazeta.uz の中央値は 80、UzDaily(RU) は 230、政府ポータルは 129。
  # ここを数千に設定すると、これら主力チャンネルが丸ごと落ちる。
  min_views_absolute: 50

  # 各チャンネルから何件さかのぼって中央値を計算するか。
  baseline_window: 40

  # 何時間以内の投稿を対象にするか（毎朝1回動かす前提で28時間）。
  lookback_hours: 28

  # 逆に「新しすぎる投稿」を除外する下限。
  # 投稿直後は閲覧数が伸びておらず、比率が「内容の良し悪し」ではなく
  # 「投稿からの経過時間」を測ってしまう。実測でも直近2件だけ
  # 0.47倍・0.28倍と急落していた。4時間の助走を全投稿に与える。
  min_age_hours: 4

relevance:
  # 本文にこれらの語が含まれると加点。ウズベク語・ロシア語・英語を混在で持つ。
  # 「日本人の不動産判断に効くか」が唯一の基準。
  keywords:
    high:     # +3
      # ロシア語 / ウズベク語ラテン / ウズベク語キリル / 英語 を併記する
      - недвижимость
      - ko'chmas mulk
      - кўчмас мулк
      - real estate
      - новостройк
      - ипотек
      - mortgage
      - Новый Ташкент
      - Yangi Toshkent
      - Янги Тошкент
      - New Tashkent
      - застройщик
      - quruvchi
      - қурувчи
      - developer
      - аренда жиль
      - ijara
      - ижара
      - цены на кварти
      - kvartira narx
      - квартира нарх
    medium:   # +2
      - инвестиц
      - investitsiya
      - investment
      - ВВП
      - YaIM
      - GDP
      - инфляц
      - ставка
      - курс сума
      - so'm kursi
      - экономик
      - iqtisod
      - иқтисод
      - бюджет
      - byudjet
      - налог
      - soliq
      - виза
      - viza
      - виза режими
      - Токио
      - Япони
      - Yaponiya
      - Japan
    low:      # +1
      - Ташкент
      - Toshkent
      - Тошкент
      - Tashkent
      - метро
      - metro
      - аэропорт
      - инфраструктур
      - строительств
      - qurilish
      - қурилиш
      - население
      - aholi
      - аҳоли

  # これらが含まれる投稿は除外（スポーツ・芸能・事故など）
  exclude:
    - футбол
    - futbol
    - матч
    - концерт
    - konsert
    - концерт дастури
    - ДТП
    - погиб
    - задержан
    - уголовн

  # 関連度スコアの下限。これ未満はエンゲージメントが高くても捨てる。
  min_score: 2

selection:
  # Claude に投げる候補の最大数（コスト制御）
  max_candidates: 25
  # 最終的に採用する本数
  max_picks: 3

