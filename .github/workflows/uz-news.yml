name: ウズベキスタンNOW 日次ニュース収集

on:
  schedule:
    # 毎朝 8:00 JST (= 23:00 UTC の前日)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "draft = 下書きのみ / auto = Xに投稿"
        type: choice
        options: [draft, auto]
        default: draft

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/uz-news-bot/requirements.txt

      - name: 依存パッケージのインストール
        working-directory: tools/uz-news-bot
        run: pip install -r requirements.txt

      - name: 収集と下書き生成
        working-directory: tools/uz-news-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python -m uznews.cli --mode "${{ inputs.mode || 'draft' }}"

      - name: 下書きと既出記録をコミット
        run: |
          git config user.name  "uz-news-bot"
          git config user.email "actions@github.com"
          git add tools/uz-news-bot/out tools/uz-news-bot/state
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore(uz-news): $(date -u +%Y-%m-%d) の下書きを追加"
            git push
          fi
